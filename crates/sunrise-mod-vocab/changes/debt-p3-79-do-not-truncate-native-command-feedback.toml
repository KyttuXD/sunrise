why = "Native console commands now run in the world spawn's level and deliver ordered, untruncated feedback to the issuing source, even when a command keeps that source for later ticks. This follows vanilla 26.3 MinecraftServer.createCommandSourceStack, TeleportCommand.teleportToPos, CommandSourceStack.sendSuccess/sendFailure/sendSystemMessage, CommandSource.sendSystemMessage, TestCommand.trackAndStartRunner and MsgCommand.sendMessage via CommandSourceStack.sendChatMessage. NeoForge's Commands.performCommand patch likewise sends command exceptions to the issuing source separately from logging."
migrate = "No call change is required for host.commands().run_command(line) or run_command_with_output(line): they now execute in the world spawn's level even when called from another level. result.success is the immediate outcome; result.feedback is the ordered, untruncated plain-text snapshot when the call returns. Move display limits to your interface. For structured or delayed messages, make (send, receive) with std::sync::mpsc::channel() and call host.commands().run_command_with_feedback(line, send) instead. Use the bool in place of result.success; handle Ok(CommandFeedback::Success(text)), Ok(CommandFeedback::Failure(text)), Ok(CommandFeedback::System(text)) and Err(TextFormError) from receive. Drain it on another thread or poll try_recv on later ticks: the game's sender can remain open after the call while the command still holds its source. A non-player source's outgoing whisper is System; only the target gets the incoming chat."
