why = "Vanilla FallbackResourceManager.getResource checks each pack's own file before its filter can hide lower files; Resource.open asks only that file's IoSupplier for a stream, and MinecraftServer.reloadResources publishes the selection after loading it. NeoForge MultiPackResourceManager couples namespace and path filters, and JarContentsPackResources.getResource opens the selected entry lazily. The native API no longer allocates the entire file on lookup, imposes the old guest reply limit MAX_RESOURCE_BYTES, returns a renderer's merged bytes, or conflates I/O failure with absence. A host or phase without access to published packs reports an error instead of unwinding."
migrate = "Replace host.resource(pack_type, &id) with host.open_resource(pack_type, &id). Handle Err(ResourceOpenError) separately from Ok(None): match Unavailable for a host or phase without access to published packs, and Io(error) for a failed lookup or open. Use the reader in Ok(Some(reader)) with std::io::Read while the host is borrowed; for the old owned result, use let mut bytes = Vec::new(); reader.read_to_end(&mut bytes)?; and handle read errors. Remove MAX_RESOURCE_BYTES imports and checks; apply any required limits in your own decoder."
