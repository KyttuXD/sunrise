why = """
General entity declarations take validated identifiers and return registered keys, as in NeoForge `RegisterEvent.register` and vanilla `MappedRegistry.register`. This preserves the original `be2c069e4a2d` intent of rejecting unencodable spawn messages without letting a wire length cap limit registration: vanilla `Identifier.STREAM_CODEC` uses `ByteBufCodecs.STRING_UTF8` (32,767 UTF-16 units), and the enclosing packet owns its payload bound. \
Vanilla `EntityType.Builder.requiredFeatures` uses `FeatureFlags.REGISTRY`, not mod dependencies. The host and entity admission see the same feature IDs, resolved like `FeatureFlagRegistry.codec` and `ClientConfigurationPacketListenerImpl.handleEnabledFeatures`. `EntityType.loadEntityRecursive` prunes disabled saved branches before `SummonCommand` checks UUIDs. \
`BaseSpawner.serverTick` and `TrialSpawner.spawnMob` have different check paths. NeoForge `EventHooks.checkSpawnPlacements` receives no spawner; `checkSpawnPositionSpawner` receives a regular `BaseSpawner` (block or minecart); and `finalizeMobSpawnSpawner` receives the actual owner, including trial spawners and either configured or unconfigured spawns. `MinecartSpawner.getOwner` provides the live cart. NeoForge `SpawnClusterSizeEvent` only asks about a mob in a natural pack, so the pack query has neither a reason nor a spawner."""
migrate = """
Replace `r.declare_general_entity("robot", ..., &["mod_id"])` with `r.declare_general_entity(Identifier::from_parts("mymod", "robot")?, ..., &[FeatureFlag::Vanilla])`. Use the actual required flags, or `&[]` for no requirement; move mod dependencies to `sunrise-mod.toml`. Retain the returned `EntityTypeKey` instead of requesting it separately, or discard it if unused. Remove any `UnknownDependency` match arm. A declaration's `id` is an `Identifier` (use `id.as_str()` to read its text); the declaration requires explicit construction. Declarations and registration errors no longer implement `Wire`. \
For feature names from text, use `FeatureFlag::from_id(id)` and handle `None`. Iterate `FeatureFlag::ALL` or use `flag.id()` for the canonical name. Query `level.enabled_features(host).is_some_and(|flags| flags.contains_flag(FeatureFlag::RedstoneExperiments))`, or use `flags.contains_all(&required)` for a slice. \
For `finalize_spawn` version 2, replace `Some(SpawnSource::Block(pos))` with `Some(Spawner::Block { pos } | Spawner::Trial { pos })` and handle `Some(Spawner::Minecart { entity })` if you need the live cart (`entity.position(host)`). `Spawner` is in-process only. Configured spawns now also reach `finalize_spawn`; use `event.spawn_cancelled = true` to stop one. Returning `Flow::Cancel` still skips only vanilla finalization. \
For `mob_spawn_placement_check` version 3, remove `event.spawner`; read `event.reason` for why the mob would spawn. For `mob_spawn_position_check` version 2, match regular `Spawner::Block` and `Spawner::Minecart`; trial spawners no longer call this hook. A panic in either check or in finalization is reported, and only that mod’s listener for that hook is disabled. Live writes and RNG draws are not rewound. \
Update `EntityPart::spawn_cluster_size` implementations to `fn spawn_cluster_size(&self, host: &dyn Host, mob: UnspawnedMobRef, vanilla: u32) -> Option<u32>`."""
