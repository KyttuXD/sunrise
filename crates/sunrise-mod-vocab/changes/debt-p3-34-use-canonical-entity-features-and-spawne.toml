ids = ["type:Identifier", "type:FeatureFlag", "type:EntityTypeKey", "type:GeneralEntityTypeDeclaration", "type:GeneralEntityRegistrationError", "method:GeneralTypesRegistrar::declare_general_entity", "type:SpawnSource", "type:Spawner", "hook:finalize_spawn", "hook:mob_spawn_placement_check", "hook:mob_spawn_position_check", "method:EntityPart::spawn_cluster_size"]
why = "General entities register a validated resource ID and return a registry key. EntityType.Builder.requiredFeatures, FeatureFlags.REGISTRY and EntityType.canSpawn check the level's enabled flags, not the installed mod list. Identifier.STREAM_CODEC bounds the serialized name, not registration. Vanilla BaseSpawner.serverTick and TrialSpawner.spawnMob, and NeoForge EventHooks.checkSpawnPlacements, checkSpawnPositionSpawner and finalizeMobSpawnSpawner, distinguish a spawn reason, a regular BaseSpawner, and the owner that performed finalization. NaturalSpawner's cluster-size query has no spawner."
migrate = "Replace declare_general_entity(\"robot\", ..., &[\"mod_id\"]) with declare_general_entity(Identifier::from_parts(\"mymod\", \"robot\")?, ..., &[FeatureFlag::Vanilla]); list the actual required flags, or pass &[] for no requirement. Put mod dependencies in the manifest. The returned EntityTypeKey can replace a separate entity_type_key request; discard it with a semicolon if unused. GeneralEntityTypeDeclaration has an Identifier id (use id.as_str() for text), requires explicit construction, and no longer has Wire. GeneralEntityRegistrationError no longer has UnknownDependency or Wire. Switch from SpawnSource to Spawner in finalize_spawn: match Block { pos }, Trial { pos }, and Minecart(cart), retaining a wildcard for future variants. Spawner is in-process only. Remove event.spawner from mob_spawn_placement_check; use event.reason for reason-based decisions. In mob_spawn_position_check, match Block and Minecart as the regular spawner sources; trials no longer fire this hook. Remove the spawner argument from EntityPart::spawn_cluster_size."
