ids = ["method:CrashSection::value", "method:CrashSectionsRegistrar::crash_section", "method:CrashSectionsRegistrar::crash_header"]
why = "FML CrashReportCallables and NeoForge CrashReportExtender.extendSystemReport register and collect each entry in order. Vanilla 26.3 SystemReport.setDetail and CrashReportCategory.setDetail evaluate each callable, put a failure on its own entry, and do not time or clip the result. The defensive formatter introduced in aaefc52ce6d0 clipped text and skipped every callable from the mod named in the crash. Keep that mod's details, pass entries through the ordinary report writer, and mark multiline continuations to retain source attribution. Keep the shared panic boundary on a separate thread."
migrate = "No signature change: keep implementing CrashSection::value and registering it with r.crash_section(label, callback) or r.crash_header(callback). None still omits the entry; Some(text) now writes the full text, with marked continuation lines. Callbacks now run even when their mod is named in the crash, and there is no deadline; read diagnostic state without waiting on the game thread or locks it may hold. A panic disables only that registration for the rest of the session."
