ids = ["method:CrashSection::value", "method:CrashSectionsRegistrar::crash_section", "method:CrashSectionsRegistrar::crash_header"]
why = "FML CrashReportCallables.getHeaders and NeoForge CrashReportExtender.extendSystemReport collect entries in registration order. Vanilla 26.3 SystemReport.setDetail and CrashReportCategory.setDetail call the supplier inline and put each failure on its own entry. The defensive formatter introduced in aaefc52ce6d0 clipped labels and text and skipped every callable from the mod named in the crash. Keep that mod's diagnostics and mark continuation lines so multiline text cannot impersonate the engine or another mod. Keep the existing crash reporter wait per callable so an invocation that needs a lock held by the crashing thread cannot prevent the other diagnostics or the report from being written."
migrate = "No code change: keep implementing CrashSection::value and calling r.crash_section(label, callback) or r.crash_header(callback). Callbacks still execute in registration order within each section unless a blocked callback has to be left behind. None still omits the entry; Some(text) now writes the full text, including line breaks marked with |. Only a callback that panics is disabled for the session."
