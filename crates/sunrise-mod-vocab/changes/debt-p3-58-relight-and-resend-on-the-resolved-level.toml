ids = ["type:ChunkRefusal", "handle:LevelRef::relight_chunks", "handle:ChunkRef::resend"]
why = "Relights and resends now queue on the handle's own open level, whether or not it is ticking. This keeps the original worker-batched relight path (add1339b99e) without request or queue quotas. Vanilla 26.3 ServerChunkCache.getChunkNow and onLightUpdate use the owning level's loaded chunks and publish completed light on the server thread. ThreadedLevelLightEngine.runUpdate and waitForPendingTasks order light before the send dependency in ChunkMap.waitForLightBeforeSending; ChunkMap.getPlayers and NeoForge's ChunkMap.markChunkPendingToSend patch keep chunk sending tied to the owning level's watchers."
migrate = "Keep calling level.relight_chunks(host, chunks) and chunk.resend(host) on the target handles. Use usize instead of u32 for a stored relight count; it still counts newly queued columns, not completed jobs. Drop NotInPlace branches and the code to switch levels before calling; drop TooManyChunks branches and quota-based splitting or retries. Stale, Client, and NotLoaded (resend only) still describe real refusals; handle Unavailable when the backend or phase does not permit the call. A resend waits for pending light work for that chunk before sending to clients that hold it; do not assume that it goes out in the call's tick."
