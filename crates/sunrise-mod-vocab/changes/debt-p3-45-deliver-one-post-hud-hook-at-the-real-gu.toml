Pre and Post run on the in-world HUD pass even when F1 hides ordinary paint. Pre's `Flow::Cancel` skips HUD slots and Post, but does not skip screens or their focused chat, or the later toast pass. `gui_layer_pre`/`gui_layer_post` and registered replacements for `minecraft:chat` only affect the background HUD slot. Use screen drawing hooks for work tied to the focused chat screen instead.
