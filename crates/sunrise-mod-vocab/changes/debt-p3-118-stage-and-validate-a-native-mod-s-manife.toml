ids = ["behaviour:native_registry_graph_isolation"]
why = "The Sunrise-only native SDK (no vanilla or NeoForge counterpart) now checks and rewrites the Cargo manifests it actually builds, collecting registry requirements in the same pass. The old source workspace exceptions and validation copy are gone, and the staged workspace receives the SDK's registry patches once. The pinned SDK paths, internals facade and lock checks still apply."
migrate = "Valid mods need no Rust or manifest changes. If E_GAME_DEPENDENCY reports a Cargo edge into the game, remove that direct or transitive dependency. Use sunrise-mod-api at .sunrise/sdk/api/crates/sunrise-mod-api; for declared game internals use sunrise-internals at .sunrise/sdk/api/crates/sunrise-internals. Declare other mods in sunrise-mod.toml, not as outside paths in Cargo.toml, and keep registry pins in Cargo.lock."
