why = "Vanilla 26.3 LivingEntity.addEffect and MobEffect.onEffectAdded, and NeoForge 26.3 MobEffectEvent.Added (LivingEntity.java.patch): separate the global bus event from the effect-owned first-insertion callback. Hooks::mob_effect_added (version 2) now models MobEffectEvent.Added for every eligible vanilla and mod effect after canBeAffected / mob_effect_applicable and before active-effect mutation, carrying entity: LivingRef, old_effect: Option<&ActiveEffect>, new_effect: &ActiveEffect, and source: Option<EntityRef>, including reapplications and unchanged updates (non-cancellable; never on forceAddEffect, load, or client sync). MobEffect.onEffectAdded moves to MobEffectPart::on_effect_added (version 2, scope = effect, key = effect) taking (effect: EffectKey, entity: LivingRef, amplifier: i32) and runs only on first insertion after the active map and attribute modifiers update and vanilla's added sound plays (before onEffectStarted). Player, mob and armor stand additions share the pre-mutation decision. If a listener changes the observed slot or removes its holder, the original attempt is refused without undoing the listener’s writes."
migrate = "In Hooks::mob_effect_added, replace event.effect with event.new_effect.id and event.amplifier with event.new_effect.amplifier. Read the holder directly as event.entity: LivingRef instead of matching its former optional numeric id (None meant the acting player); use event.entity.entity().id() only if you need the numeric id. Read the active instance before the attempt from event.old_effect and the cause, if any, from event.source. Implement MobEffectPart::on_effect_added on the effect's Part and register the Part for that effect with Registrar::mob_effect_part; remove Hooks::on_effect_added. The Part receives the same first-insertion effect key and amplifier, with a LivingRef in event.entity. Keep calling LivingRef::add_effect as before: it now refuses every effect on a wither, accepts eligible armor stands, and notifies the pre-mutation Added event for eligible vanilla and mod effects, including unchanged reapplications, rather than the old post-mutation custom-only notice. Keep calling LivingRef::effect, effects, potion_affected, remove_effect, and remove_all_effects as before; they now read or remove active armor stand effects rather than treating armor stands as unsupported."
