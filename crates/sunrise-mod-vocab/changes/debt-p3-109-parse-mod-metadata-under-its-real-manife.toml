ids = ["behaviour:manifest_metadata", "handle:PackageInfo::property", "handle:PackageDependency::reason"]
why = "The published sunrise-mod.toml byte limit already covers the whole file. Separate property and reason quotas rejected valid metadata, and a second, lower scan limit could keep a native package from getting a uses list. Invalid dependency versions and URLs are reported at their declaration or field during parse. There is no vanilla mod manifest; AbstractPackMetadataResources.loadMetadata is the analogous file boundary, and NeoForge's ModInfo and ModInfo.ModVersion constructors read properties and reasons without separate quotas."
migrate = "No manifest or API call needs to change. Keep your existing property scalars and policy reasons, and keep using PackageInfo::property(key) and PackageDependency::reason(). Keep semver strings, detailed tables or existing positional arrays as written. A dependency row still needs a semver version and any policy URL still needs https://. Delete checks against MAX_PROPERTIES, MAX_PROPERTY_BYTES and the old 512-byte reason quota; use sunrise_mod_package::manifest::MAX_MANIFEST (32 MiB) for the complete file, including when checking whether a project can be scanned."
