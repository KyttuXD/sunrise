ids = ["type:ServerPlayer"]
why = "Remove the unproduced ServerPlayer snapshot, its hidden builder and the remaining direct Game adapters superseded by typed handles. Remove the unused hidden TooltipDisplay transport constructor; the tooltip hook still lends its display. Keep the checks at the stack boundary and read the resolved stack directly for item bars, as vanilla ItemStack.isBarVisible, Item.getBarWidth/getBarColor and BundleItem.isBarVisible/getBarWidth/getBarColor do. NeoForge leaves that bar path on the stack; its ItemStackResourceHandler.getResource likewise reads the backing stack. The retired Sunrise-only adapters have no vanilla counterparts."
migrate = """
- Replace `mod_api::ServerPlayer` (and construction through `mod_api::__private::built::ServerPlayer`) with `PlayerRef` from `host.player(uuid)`, `host.players().player_by_name(name)` or `host.players().acting_player()`. Read `uuid` with `player.uuid()`, `name`, `permission`, `dimension`, `game_mode` and `address` with `player.name(host)`, `.permission_level(host)`, `.dimension(host)`, `.game_mode(host)` and `.address(host)`. Use `player.entity().id()` for the transient entity ID, `.position(host)` for position and `.rotation(host)` for `[yaw, pitch]`; `host.living(player.entity()).and_then(|living| living.health(host))` reads health. Check the `Option` answers when a body or connection is unavailable.
- Do not construct a tooltip display through `TooltipDisplay::__wire_from_fields`. Use the display the `item_tooltip` callback lends, or call `TooltipDisplay::for_stack(&stack)` to read an owned API stack's effective display. `ItemResource::bar(host)` has the same signature.
- Replace private Game mirror calls with named levels and typed handles. Use `level.spawn_mob(host, kind, pos, reason)` and `level.visit_all_entities(host, &mut visit)` with `host.mob(entity)` for mobs; use `level.visit_entities_in(host, min, max, &mut visit)` with `host.item_entity(entity)` and `item.with_stack(host, read)` for dropped items. For recipes use `host.recipes_of_type(kind)` or `level.recipe_for(host, &kind, &input)`; recipe-book display IDs still come from `host.recipe_book_ids(recipe_id)`.
- For live player inventory reads use `player.with_inventory(host, read)` or `player.with_ender_chest(host, read)`, and for writes use `player.set_inventory_slot(host, slot, stack)` or `player.set_ender_chest_slot(host, slot, stack)`. Use `host.transaction` if a write to one slot depends on another. The private offline file adapter has no replacement. Use `host.set_display_slot(DisplaySlot::Sidebar, Some(objective))` for an objective on the server scoreboard; it is not a private client-only sidebar.
- Replace `native_data(\"data/mymod/machines.json\")` with `host.resource(PackType::ServerData, &Identifier::parse(\"mymod:machines.json\")?)` on the server. Replace private component helpers with `ItemResource::value/with_component/without_component` or use `ItemPlace::edit` for resident stacks. Use `BlockEntityRef::replace_data` for saved block-entity payload writes and `host.chat_line(text)` for local chat. In a draw callback use `draw.size()` for the GUI dimensions. The retired click/frame counters and private physical window query have no 1.0 equivalents.
"""
