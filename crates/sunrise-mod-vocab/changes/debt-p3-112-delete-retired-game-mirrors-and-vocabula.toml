ids = ["type:ServerPlayer"]
why = "Remove the unproduced ServerPlayer snapshot, its hidden builder and the direct Game adapters superseded by typed handles. Remove the unused hidden TooltipDisplay transport constructor; the tooltip hook still lends its display. ItemStack.isBarVisible/getBarWidth/getBarColor dispatch to the registered item's behavior (Items.BUNDLE and Items.DYED_BUNDLE), not to whichever components happen to be in its defaults. Use the already checked engine stack for bar reads, following vanilla ItemInstance.get and BundleContents.getWeight for effective contents, including inherited contents in nested templates and explicit empty values written by BundleContents.Mutable.toImmutable. As in BundleItem.getTooltipImage and AbstractContainerMenu.tryItemClickBehaviourOverride, the presence of that component does not give ordinary items a bundle tooltip or click behavior. Uncomputable weights follow BundleContents.computeContentWeight and BundleItem.getWeightSafe. NeoForge leaves the bar and weight dispatch intact; its BundleItemHandler reads and writes the component on the backing item resource. The retired Sunrise-only adapters have no vanilla counterparts."
migrate = """
- Replace `mod_api::ServerPlayer` (and construction through `mod_api::__private::built::ServerPlayer`) with `PlayerRef` from `host.player(uuid)`, `host.players().player_by_name(name)` or `host.players().acting_player()`. Read `uuid` with `player.uuid()`, `name`, `permission`, `dimension`, `game_mode` and `address` with `player.name(host)`, `.permission_level(host)`, `.dimension(host)`, `.game_mode(host)` and `.address(host)`. Use `player.entity().id()` for the transient entity ID, `.position(host)` for position and `.rotation(host)` for `[yaw, pitch]`; `host.living(player.entity()).and_then(|living| living.health(host))` reads health. Check the `Option` answers when a body or connection is unavailable.
- Do not construct a tooltip display through `TooltipDisplay::__wire_from_fields`. Use the display the `item_tooltip` callback lends, or call `TooltipDisplay::for_stack(&stack)` to read the display component in an owned API stack.
- In native engine code, replace `sunrise_items::bundle::Contents::bar()` (also reached through `sunrise_client::bundle`) with `sunrise_items::properties::stack_bar(items, &stack, items.get(&stack.item)).map(|bar| (bar.width, bar.color))`, using the original engine stack. For a mod API `ItemResource`, continue to use `resource.bar(host)`. A content item that needs BundleItem behavior must use a vanilla bundle as its template; adding a contents component alone does not give an ordinary item a fullness bar.
- In native engine code, replace `contents.store(&mut stack)` with `contents.store(items, &mut stack)` and `bundle::toggle_selected(&mut stack, index)` with `bundle::toggle_selected(items, &mut stack, index)`. Pass the active item table so writes and selection can distinguish empty patches from inherited contents. For a direct call to `Hub::select_bundle_item(conn, slot, index, world)`, pass that item table as its last argument.
- Replace private Game mirror calls with named levels and typed handles. Use `level.spawn_mob(host, kind, pos, reason)` and `level.visit_all_entities(host, &mut visit)` with `host.mob(entity)` for mobs; use `level.visit_entities_in(host, min, max, &mut visit)` with `host.item_entity(entity)` and `item.with_stack(host, read)` for dropped items. For recipes use `host.recipes_of_type(kind)` or `level.recipe_for(host, &kind, &input)`; recipe-book display IDs still come from `host.recipe_book_ids(recipe_id)`.
- For live player inventory reads use `player.with_inventory(host, read)` or `player.with_ender_chest(host, read)`, and for writes use `player.set_inventory_slot(host, slot, stack)` or `player.set_ender_chest_slot(host, slot, stack)`. Use `host.transaction` if a write to one slot depends on another. The private offline file adapter has no replacement. Use `host.set_display_slot(DisplaySlot::Sidebar, Some(objective))` for an objective on the server scoreboard; it is not a private client-only sidebar.
- Replace `native_data(\"data/mymod/machines.json\")` with `host.resource(PackType::ServerData, &Identifier::parse(\"mymod:machines.json\")?)` on the server. Replace `native_component`, `native_set_component` and `native_remove_component` with `resource.value(host, &id)`, `resource.with_component(host, &id, value)` and `resource.without_component(host, &id)`. The edits return detached resources; for resident stacks use `place.exchange(host, tx, &changed, 1)` inside a transaction.
- Replace `native_with_mod_block_entity` with `entity.replace_data(host, data)` for saved NBT or `entity.set_data_slots(host, slots)` for transient menu data. To notify after a separate persistent storage write, call `entity.set_changed(host)`. Use `host.chat_line(text)` for local chat and `draw.size()` for GUI dimensions. The retired click/frame counters and private physical window query have no 1.0 equivalents.
"""
