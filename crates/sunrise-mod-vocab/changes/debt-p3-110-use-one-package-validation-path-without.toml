why = "Native build now discovers candidates by sunrise-mod.toml and uses the package reader's schema and path rules. Loose projects no longer reserve the names of retired layouts. Native archives still accept only the package's allowed files. The manifest reader refuses native state before it can affect serialization or build routing: adding fields would change the prebuilt game's layout. The native build host can still translate that refusal using its stable message key and the mod and row ids. This is Sunrise's .smod format, with no vanilla or NeoForge counterpart."
migrate = "Use root sunrise-mod.toml for mod metadata and build pins, root Cargo.toml and src/ for code, assets/ and data/ for pack resources, and declared runtime/ files for native runtime data. Move any code intended for the package from native/ or rust/ to src/. Move source edits into the supported [[native.*]] tables in sunrise-mod.toml, then remove handwritten horizon-mixin.toml from the project: the builder writes its own tool manifest in staging. Repack any manually assembled archive with cargo sunrise-mod build so it contains only package files. Remove [[native.state]] (or state = []). For state owned by an entity, block entity, chunk, level or player, register AttachmentType<T> and use the corresponding Holder. For state owned by the whole Game, declare [[native.loop]] for the relevant published loop and put the field on its slot type (with); initialize it in Default and read or write it on self in the slot callbacks. That value lives once per Game, not once per level. Tools using Native.state must drop that access, not classify or serialize a state row, and use Manifest::parse or Package::read to get the named E_MIXIN_STATE_LAYOUT refusal. Tools that translate package refusals can call Package::read_with_diagnostics(path, render) and format NativeStateRefusal::TEMPLATE with mod_id as {mod} and row as {state}. Other reader and classifier calls stay the same."
