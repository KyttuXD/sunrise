ids = ["hook:living_damage_post"]
why = "Vanilla 26.3's `BreathAirGoal.tick` completes its move before `GoalSelector.tickRunningGoals` advances, and `Mob.serverAiStep` finishes the target selector before the ordinary goal selector. NeoForge's `LivingEntity.hurtServer` calls `CommonHooks.onLivingDamagePost` after death or protection, before returning. `GoalSpec::BreathAir` now uses that same hurt boundary in either selector, not just in a dolphin's ordinary selector."
migrate = "Keep `mob.add_goal(host, priority, &GoalSpec::BreathAir)` or `mob.add_target_goal(host, priority, &GoalSpec::BreathAir)` and the same `living_damage_post` signature and version. A landing hit now posts before the rest of the move and the next goal. If a listener relied on the old delay, use the in-hit result or schedule the later work explicitly."
