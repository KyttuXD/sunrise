why = """
Retires `LandingWrite` and its encoded command batch, sibling rollback, and engine-side unchanged-block replay gate. Vanilla `Block.fallOn(Level, BlockState, BlockPos, Entity, double)` and its overrides (`HayBlock`, `HoneyBlock`, `SlimeBlock`, `PowderSnowBlock`, `PointedDripstoneBlock`, `FarmlandBlock`, `TurtleEggBlock`) and `Block.bounceOn(Level, BlockState, BlockPos, Entity, double)` (`ShelfMushroomBlock`) receive the live `Entity` and `Level` directly so overrides can inspect `Entity.isSuppressingBounce()` / `isShiftKeyDown()`, `isCrouching()`, `getBbWidth()`/`getBbHeight()`, position, velocity, and fall distance, adjust entity motion directly (`Entity.setDeltaMovement`, `Entity.resetFallDistance`), and perform level writes, block destruction (`Level.destroyBlock`), sounds, particles, and level events at the actual landing or bounce site before `super.fallOn` (`causeFallDamage`), `HIT_GROUND`, `GameEvent.BOUNCE`, and any later landing in the same tick. NeoForge's `IBlockExtension.getBounceRestitution` only returns a restitution factor and has no separate landing write batch. Lending a scoped `LandingEntity` alongside `&mut dyn LevelWriteHost` (now including `destroy_block`) at both `fall_on` and `bounce_on` gives mods direct access to the falling/bouncing entity and authoritative level writes at the landing/bounce site (players, mobs, and dropped items), while keeping owned native callbacks (`FallOnEvent::after_landing` and `BounceOnEvent::after_bounce`) for deferred `&mut dyn ServerHost` work that belongs after the entity batch, with local state checks owned by each callback and per-mod panic containment via `CallbackOwner`.
"""
migrate = """
`BlockPart::fall_on` bumps to `hook_version = 3` and `BlockPart::bounce_on` bumps to `hook_version = 2`, and both now receive `&mut dyn LevelWriteHost` instead of `&mut dyn LevelRandomHost`. Replace reads of `event.entity` (formerly `i32`) and `event.kind` (formerly `&str`) with `event.entity.id()` and `event.entity.kind()` on the lent `LandingEntity<'_>`, which also provides `position()`, `block_position()`, `velocity()`, `fall_distance()`, `on_ground()`, `is_crouching()`, `is_suppressing_bounce()`, `dimensions()`, `set_velocity(...)`, and `reset_fall_distance()`. Replace `event.request(LandingWrite::SetBlock(state))` and `event.request(LandingWrite::DestroyBlock { drop })` with direct `host.set_block(...)` / `host.destroy_block(...)` calls on `&mut dyn LevelWriteHost` when the write belongs at the landing/bounce site before `causeFallDamage`/`HIT_GROUND`/`BOUNCE`, or with `event.after_landing(move |host| { ... })` / `event.after_bounce(move |host| { ... })` for deferred `&mut dyn ServerHost` work after the batch (checking `level.block_state(host, pos) == Some(expected)` inside the callback when needed).
"""
