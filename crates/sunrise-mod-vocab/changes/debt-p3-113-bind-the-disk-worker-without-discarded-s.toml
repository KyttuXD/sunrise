ids = ["behaviour:chunk_disk_level_identity"]
why = "Each opened level binds its world epoch, dimension and immutable resources to the shared save directory before submitting any chunk work. This follows vanilla 26.3 ChunkMap's constructor and IOWorker: storage belongs to the level, and ChunkMap.save passes the actual serialization record to IOWorker.store. NeoForge's ChunkDataEvent.Save in ChunkMap.save also sees that record. Sunrise keeps its existing worker callback and pending writes and no longer scans a second snapshot path. The level open reports an invalid dimension identifier instead of panicking, as vanilla Identifier.read reports a parse error."
migrate = "Ordinary mods need no change to chunk_data_load or chunk_data_save. Native patches should delete calls to native_full_chunk_snapshots, native_late_full_chunk_snapshot, native_full_chunk_snapshot, native_proto_snapshots and native_proto_snapshot; the existing save_later, save_finished and proto submission calls still submit the records. Drop Streaming::proto_access, ProtoAccess, ProtoSnapshot (including block and its fields), and uses or implementations of ChunkGenerator::proto_status and proto_block. In chunk_data_save use host.job() for the owning level, chunk coordinates and full/proto kind, and event.data to edit stored attachments; this hook does not expose proto blocks or generation status. Call bind_chunk_disk_worker only while adopting a newly opened level, and propagate its Result with ?."
