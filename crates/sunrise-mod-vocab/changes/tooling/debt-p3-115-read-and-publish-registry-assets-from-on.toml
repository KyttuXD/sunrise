# Tooling-only migration note; the surface checker requires a changed mod_api ID in top-level notes.
ids = []
why = "The CLI already targeted sunrise-org/sunrise-mods; the package library and submission service still defaulted to the Horizon repository after the split. All three now use the Sunrise registry for mirrored packages and native archives. This is Sunrise-only; there is no vanilla or NeoForge counterpart."
migrate = "No mod source or manifest changes. Keep using sunrise_mod_package::index::FILE_HOST; it now points to https://github.com/sunrise-org/sunrise-mods/releases/download/. In Rust tooling, use sunrise_mod_package::index::REGISTRY_REPO instead of a literal registry repository slug. Replace an explicit --release pointing to the old default with no --release option; keep intentional test bases. Remove an explicit REGISTRY_REPO=horizon-rust/horizon-mods from a Sunrise deployment, or set REGISTRY_REPO=sunrise-org/sunrise-mods. Keep the author release URLs in published file and binaries rows unchanged."
