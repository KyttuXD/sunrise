# Registry tooling only; no `mod_api` surface item changed.
ids = []
why = "The Sunrise registry now stages and mirrors packages and native binaries in sunrise-org/sunrise-mods. The CLI, package library and submission service use the same repository instead of retaining the old Horizon release default. This is Sunrise-only; vanilla and NeoForge have no registry release mirror."
migrate = "Keep importing sunrise_mod_package::index::FILE_HOST; it now points to https://github.com/sunrise-org/sunrise-mods/releases/download/. If Rust tooling needs the GitHub owner/repo slug instead of the download URL, import sunrise_mod_package::index::REGISTRY_REPO rather than hard-coding it. Omit --release from cargo sunrise-mod registry build to use the Sunrise mirror. If a deployment sets the REGISTRY_REPO environment variable to horizon-rust/horizon-mods only to select the default, remove that setting or set it to sunrise-org/sunrise-mods. Keep intentional test bases and the author release URLs in published file and binaries rows unchanged."
