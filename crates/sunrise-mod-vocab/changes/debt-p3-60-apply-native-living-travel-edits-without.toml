why = '''The per-listener validator introduced in `9367552729b` kept malformed vectors away from later listeners, but a refused reply also discarded separate valid edits and cancellation. The callback now writes the input passed to vanilla 26.3 `LivingEntity.travel` and `LivingEntity.travelInAir` (or `Player.travel` after swim steering) and the body's actual delta movement. `Entity.getInputVector` owns input normalization; `Entity.setDeltaMovement` admits finite vectors without a magnitude cap, including writes from `Entity.move`. NeoForge's `LivingEntity.travelInWater` patch changes the speed passed to `Entity.moveRelative` and adds no travel event. Sunrise compares the effect of an input edit at that operation's actual speed and yaw, while movement reports retain their existing validation (`ServerGamePacketListenerImpl.handleMovePlayer`). A malformed native edit refuses only its own write and logs each refusal. A panic disables only the failed callback, logs and queues a named error toast, and leaves completed writes and earlier cancellation intact for the remaining listeners. The hook moves to version 2.'''
migrate = '''Keep implementing `Hooks::living_travel(&self, context: &dyn LoopContext, event: &mut LivingTravelEvent<'_>) -> Flow`. Replace reads of `*event.input` and `*event.velocity` with `event.motion.input()` and `event.motion.velocity()`. Replace `*event.input = v` and `*event.velocity = v` with `event.motion.set_input(v)` and `event.motion.set_velocity(v)`. To change one component, read the vector into a local array, change that component, and pass the array to the setter. Each setter returns `false` for a non-finite vector and leaves that vector unchanged; handle that result independently of other writes. Keep returning `Flow::Cancel` or setting `event.cancelled = true` to skip travel, but do not rely on cancellation or a later panic to undo a successful velocity write. Edits that do not change the acceleration applied by the player's selected branch no longer send a movement correction. Rebuild against the new SDK and set `hook_version = 2` if you pin `living_travel`.'''
