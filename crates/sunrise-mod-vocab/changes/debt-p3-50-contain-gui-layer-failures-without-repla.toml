ids = ["behaviour:gui_layer_failure"]
why = "Vanilla Gui.extractRenderState and NeoForge GuiLayerManager.render/renderInner submit HUD layers into the same frame in order. Follow that drawing model instead of undoing completed HUD primitives when a mod painter or wrapper fails. Later layers still draw; refusals are reported each time, and a panic is logged and shown in an error toast naming the mod and disables only the panicking callback for the session."
migrate = "Keep your register, replace_layer, and wrap_layer calls and the GuiLayerDraw and GuiLayerWrapper signatures. Paint already submitted by the painter, via GuiLayerWrapContext::with_draw, or through GuiLayerWrapContext::draw_previous stays; none is replayed. If you relied on paint being erased on failure, perform any checks that should suppress the whole layer before the first draw call (including ctx.draw_previous()), and return without painting if a check fails. A disabled wrapper still leaves the previous body to draw directly on later frames."
