ids = ["behaviour:gui_layer_failure"]
why = "Vanilla 26.3 Gui.extractRenderState and Hud.extractRenderState pass one extractor through HUD drawing. NeoForge GuiLayerManager.render and renderInner do the same for registered layer callbacks. Sunrise no longer undoes completed primitives from a failed painter or wrapper. Pose and scissor cleanup still runs and each draw is still checked; the next layer draws independently. Refusals are reported each time. A panic logs and queues an error toast naming the mod and disables only that callback for the session."
migrate = "Keep your GuiLayerRegistrar::register, replace_layer, and wrap_layer calls and the GuiLayerDraw and GuiLayerWrapper signatures. If you relied on a failure erasing the layer's paint, move fallible preparation before the first drawing call, including GuiLayerWrapContext::draw_previous, and return without painting if preparation fails. Paint already submitted directly, via GuiLayerWrapContext::with_draw, or via draw_previous stays in order; the engine does not replay it. A disabled wrapper still leaves the previous body to draw directly on later frames."
