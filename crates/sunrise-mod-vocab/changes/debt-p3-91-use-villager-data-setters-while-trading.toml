ids = ["handle:MerchantRef::set_profession", "handle:MerchantRef::set_villager_type", "method:MerchantsBackendMut::merchant_set_profession", "method:MerchantsBackendMut::merchant_set_villager_type", "hook:trade_with_villager"]
why = "Vanilla 26.3 Villager.setVillagerData invalidates the offer list only when the profession changes and never resends it directly. AbstractVillager.getOffers rolls the list when next requested, while MerchantContainer.updateSellItem owns the menu's active offer. NeoForge's AbstractVillager.notifyTrade fires TradeWithVillagerEvent on the live villager before MerchantResultSlot.onTake updates the payment slots. Sunrise now follows those same boundaries even with a trade open."
migrate = "Keep calling MerchantRef::set_profession(host, profession) and MerchantRef::set_villager_type(host, kind); signatures are unchanged. You no longer need to wait for the trade to close or skip these calls in trade_with_villager. Do not expect the setter to resend the offers or change an already completed take. A different profession invalidates the list for its next lookup; changing just the type preserves it and affects future rolls."
