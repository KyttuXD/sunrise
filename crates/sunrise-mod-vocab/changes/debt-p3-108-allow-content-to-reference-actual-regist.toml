why = "Vanilla 26.3 BlockItem.<init> and Item.Properties.craftRemainder accept registered objects, not package or namespace owners (ItemStackTemplate.<init> still rejects air). Content checks use the canonical Identifier validator, including Identifier.isValidNamespace's rejection of two dots. Vanilla MobEffects.register puts the built-in effects in the registry the game actually uses. NeoForge BlockEntityTypeAddBlocksEvent.modify and RegisterCapabilitiesEvent.registerBlockEntity extend registered types without checking owners, and ModLoadedCondition.test checks the loaded ModList, not candidate metadata. Sunrise resolves registry targets separately from the admitted, side- and override-filtered dependency graph."
migrate = "In item files, set block and crafting_remainder to the target's full registry ID, even across packages. In native Item drafts use Some(\"namespace:path\".into()) or a bare name for your own namespace; omit crafting_remainder instead of pointing it at minecraft:air. Missing registered targets now fail at load, not package parsing. Hooks::component_types now runs before Hooks::register; declare the component IDs without relying on state initialized by register. Keep manifest dependencies wherever installation, version or load order really depends on another package. For optional integration, declare package_id as optional in [dependencies]. Replace automatic optional skipping or context.mods().get(\"package_id\").is_some() with if context.has_optional_dependency(\"package_id\") in Hooks::register. Put both block_entity_type_key or effect_key and the Part attachment inside the check; pass the actual registry ID to the key method. A requested missing key still fails with the mod and target named. Handle BlockEntityPartError::InvalidKey { kind } separately from Duplicate; for block_entity_part_with_state the same error is BlockEntityStateError::Part(BlockEntityPartError::InvalidKey { kind }). Report errors with context.refuse and return from Hooks::register. Built-in Part refusals use actual registry entries, and context.registry(\"minecraft:mob_effect\") now reads the game's built-in effect inventory, without mod effects."
