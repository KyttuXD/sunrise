why = """
The dedicated Zoom hook combined mod-owned input, easing, projection and turn policy, with artificial caps. Vanilla Camera.tickFov uses the actual viewpoint player or a neutral target for a non-player. It eases and clamps the modifier to 0.1..=1.5. NeoForge fires ComputeFovModifierEvent at the interpolated return of AbstractClientPlayer.getFieldOfViewModifier; the first-person spyglass returns 0.1 earlier and bypasses that event. Camera.update calculates the world then hand angles, and NeoForge fires ViewportEvent.ComputeFov at the common end of Camera.modifyFovBasedOnDeathOrFluid. Culling, terrain and overlays use the extracted world angle rather than dispatching again. Camera.createProjectionMatrixForCulling uses the larger of that angle and the FOV option. Vanilla MouseHandler.turnPlayer and NeoForge CalculatePlayerTurnEvent concern mouse options, not controller input. AdjustPlayerTurnEvent fits the device-neutral boundary at vanilla Entity.turn, just before input deltas become degrees and vanilla applies pitch and vehicle constraints. NeoForge RegisterKeyMappingsEvent and vanilla KeyMapping.isDown supply held input. Each camera/turn listener's accepted edits flow to the next; a refusal is reported each time, while a panic is logged, shows a named error toast, and disables only that callback for the session.
"""
migrate = """
Remove Hooks::zoom, ZoomEvent, Zoom { factor, smooth, turn }, and any HookId::Zoom subscription. Register the binding with Registrar::register_key_mapping in Hooks::register; in client_setup resolve it with host.mod_key_mapping(owner, id) and retain the ModKeyMappingRef. Read mapping.is_down(host) and host.playing() in client_tick_post or render_frame_pre, and keep the animation and held state in your mod. Replace smooth: true with event.modifier /= factor in Hooks::compute_fov_modifier for vanilla easing. For smooth: false or custom easing, use event.degrees /= factor in Hooks::compute_fov only when event.projection == mod_api::client::camera::FovProjection::World. Use event.partial to interpolate your own state and leave the final angle alone when event.scoping if the spyglass should win. Apply the zoom through one FOV path, not both. Replace Zoom.turn by multiplying event.yaw_delta and event.pitch_delta by the turn scale in Hooks::adjust_player_turn; the deltas are Entity.turn inputs, not angles in degrees. These changes don't write any option.
Existing Hooks::compute_fov_modifier subscribers still edit event.modifier, which starts at the vanilla blended value. Replace reads of the old blended event.base with lerp(event.effect_scale, 1.0, event.base); base is now raw. The player describes the actual viewpoint, and there is no modifier event for non-player cameras or the first-person spyglass. Move any per-tick state changes that must run at those times into a client tick callback. Existing Hooks::compute_fov subscribers should check FovProjection::World to avoid changing the hand/HUD; degrees is no longer pre-adjusted by an engine zoom, and overlays and terrain do not produce extra calls. Hooks::calculate_player_turn is still for mouse sensitivity and cinematic smoothing, now isolated per callback and not fired for the independent free camera; move device-neutral delta edits to Hooks::adjust_player_turn.
"""
