ids = [
    "hook:menu_clicked",
    "method:MenuPart::menu_clicked",
    "type:MenuClickedEvent",
    "method:MenusServerHost::open_menu",
    "method:MenusServerHost::close_menu",
    "method:MenusServerHost::menu_set_items",
    "handle:PlayerRef::open_menu",
