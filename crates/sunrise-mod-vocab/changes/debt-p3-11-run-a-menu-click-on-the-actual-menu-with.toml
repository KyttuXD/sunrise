ids = ["hook:menu_clicked"]
why = "Vanilla 26.3 ServerGamePacketListenerImpl.handleContainerClick calls AbstractContainerMenu.clicked on the receiving menu. Its doClick reads the live slots and cursor and uses Slot.mayPickup, safeInsert and safeTake; Container.stillValidBlockEntity checks the original backing instance. NeoForge's patch to AbstractContainerMenu.tryItemClickBehaviourOverride lets a pickup override skip the default without restoring inventory; it has no general clicked event. Sunrise likewise runs menu_clicked before the real slot action and no longer rolls back the listener's committed writes when the click is cancelled or refused. A panicking callback is reported by log and error toast and disabled for that mod and hook for the session."
migrate = "Keep the MenuPart::menu_clicked signature and rebuild for hook version 4. Replace host.transaction_current().unwrap() and writes using that token with host.transaction(|host, tx| { /* write using tx */ Ok(()) }); return Err from that transaction to undo its writes. Flow::Cancel skips only the default click; Flow::Continue runs the default with the current slots and cursor if the receiving menu is still valid. Do not mutate event fields to communicate with later listeners: each listener gets the original input. To close or replace a menu, call close_menu or MenuRef::close_container, or open_menu, PlayerRef::open_menu, open_mod_menu or open_ender_chest directly rather than deferring past the click. The old click never applies to the replacement. ClickInProgress applies to a pending merchant take, not this hook. menu_set_items outside an explicit transaction publishes its own update; a default-action refusal will not undo it."
