ids = ["hook:consume_effect"]
why = "Vanilla's ConsumeEffect.CODEC binds the effect type at decode, and Consumable.onConsume calls the ordered effects with the original stack and user after emission and component listeners. Consumable.emitParticlesAndSounds, LivingEntity.spawnItemParticles, FoodProperties.onConsume, ApplyStatusEffectsConsumeEffect.apply and TeleportRandomlyConsumeEffect.apply use the user's random stream. PlaySoundConsumeEffect.CODEC accepts direct and registry sound holders, and ServerLevel.playSeededSound uses SoundEvent.getRange for broadcast. NeoForge's IItemExtension use lifecycle and LivingEntity.completeUsingItem patch preserve the finish call before EventHooks.onItemUseFinish. Sunrise binds native callbacks at decode and lets nested effects run. A callback panic disables that consume callback without stopping the rest of the list; an unwind from delegated living-effect work propagates without blaming the caller, after restoring any temporarily swapped player and level."
migrate = "Keep the same Hooks::consume_effect and LivingRef::apply_consume_effect(host, &stack, index) signatures. If your manifest pins consume_effect, request hook_version = 3. Give recursive effect chains their own stopping condition rather than relying on same-kind suppression. For a custom effect, Some(true) means callback completion, not a state change; Some(false) means a missing, disabled or failing callback. LivingRef::add_effect, LivingRef::remove_effect, LivingRef::remove_all_effects and LivingRef::apply_consume_effect do not convert delegated engine or listener panics into unsuccessful consume callbacks. Do not catch those faults to continue consuming. In saved play_sound entries, keep the string id or use {sound_id: 'yourmod:sound', range: 8.0} for a direct holder with a fixed broadcast range."
