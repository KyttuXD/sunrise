ids = [
  "method:EntityLayers::entity_types",
  "method:EntityLayers::player_models",
  "type:EntityRendererRegistry",
  "handle:EntityRendererRegistry::into_renderers",
  "hook:register_entity_layers",
  "hook:register_entity_renderers",
]

why = """
Vanilla 26.3 builds each draw's state in `EntityRenderer.createRenderState` and submits that draw in
`EntityRenderer.submit`, with `LivingEntityRenderer.submit` calling `RenderLayer.submit` in layer order.
Sunrise used to mute a renderer or layer after any failed draw. Now an `Err` discards only that
submission and is logged each time, leaving later submissions active. Only a panic disables the
callback for the session; the shared callback policy logs the panic and raises an error toast naming
the mod. The engine owns renderer registration so it can retain that attribution across reloads.
NeoForge's `EntityRenderersEvent.AddLayers.getEntityTypes` and `getSkins` return views of the renderer
metadata; `EntityLayers` now borrows those lists instead of rebuilding them for each caller.
"""

migrate = """
- Rebuild against `register_entity_layers` v5 and `register_entity_renderers` v5. The hook signatures and
  the two `submit` signatures stay the same. Return `Err` to skip the current draw, not to disable later
  submissions. For a failed replacement draw, the type draws as it would with no registered renderer.
- Replace consumption of `event.layers.entity_types().into_iter()` as `String`s with
  `event.layers.entity_types().iter().map(String::as_str)` to borrow ids; use `.to_vec()` only if ids
  must outlive the borrow. When you select targets before calling `add`, first collect the selected
  ids as owned `LayerTarget::Entity(id.to_owned())` values, then iterate those targets to add layers.
- Replace iteration of `event.layers.player_models()` as owned `PlayerModel`s with
  `event.layers.player_models().iter().copied()`. When adding layers for all models, use
  `let models = event.layers.player_models().to_vec();` and loop over `models` while calling `add`.
- Replace `EntityRendererRegistry::default()` / `register(...)` / `into_renderers()` with
  `event.renderers.register(entity_type, renderer)` inside `register_entity_renderers`. The engine
  builds and keeps the resulting registry.
- Continue to call `EntityLayers::add(target, layer)` each reload. Re-adding the same `Arc` keeps its
  panic state even if it moves to a different target or position. Pass a new layer's `Arc` when
  replacing it; the new callback does not inherit the old one's panic state.
"""
