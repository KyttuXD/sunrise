why = "Property writes now share the same BlockUpdateFlags as whole-state writes, matching the flag combination accepted by vanilla Level.setBlock and used by NeoForge IBlockExtension.onDestroyedByPushReaction. Level sounds now take SoundSource like vanilla LevelAccessor.playSound and Level.playSound. Numeric representations stay in the engine; the sound queue and seed timing are unchanged. Restricted levels and the game's item capability now lend the same side-local resident slot instead of copying it up front. That follows vanilla Container.getItem's resident stack and NeoForge WorldlyContainerWrapper.getResource/getAmountAsLong through VanillaContainerWrapper's slot wrappers, without granting the read-only view authority to unpack loot. Block, fluid and item tag membership now share the typed Tags service and key/state is_in_tag(tags, tag) helpers, following vanilla TypedInstance.is(TagKey) on BlockBehaviour.BlockStateBase and FluidState (and ItemStack.is(TagKey)): raw string tag helpers on TagsHost and LevelHost are removed, each host/level view reads its own selected snapshot without substituting local pack tags on clients, and worldgen FeatureContext::block_in_tag takes a retained TagKey instead of &str. States and fluid keys now read facts through the same BlockStates tables on a full host and a restricted level without granting write access. The outline borrows the block-local boxes of vanilla BlockBehaviour.BlockStateBase.getShape with EmptyBlockGetter at the origin; the fluid state follows BlockStateBase.getFluidState and a position read follows BlockGetter.getFluidState. Fluid facts follow vanilla Fluid.isSame, getBucket and getPickupSound and NeoForge FluidType.getSound(SoundActions.BUCKET_EMPTY). The friction view keeps the read-only LevelReader scope of IBlockExtension.getFriction. TagsHost becomes tag-only; the saved name lookup keeps its contract on LevelFluidsHost."
migrate = """
- `level.set_block_property(pos, key, value, raw_flags)` -> `level.set_block_property(pos, key, value, flags)` with `flags: BlockUpdateFlags`. Make the same last-argument change in `host.set_block_property_with(pos, key, value, flags)` and in trait implementations. Use `BlockUpdateFlags::NONE` for `0`, `BlockUpdateFlags::CLIENTS` for `UPDATE_CLIENTS` (`2`), and `BlockUpdateFlags::NEIGHBORS | BlockUpdateFlags::CLIENTS` for `UPDATE_ALL` (`3`). If a call already combines `BlockUpdateFlags`, pass the combination without `.bits()`. The three-argument `host.set_block_property(pos, key, value)` is unchanged.
- `level.play_sound(sound, at, source.index(), volume, pitch)` -> `level.play_sound(sound, at, source, volume, pitch)` with `source: SoundSource`; use `SoundSource::Blocks` for the old ordinal `4`, for example. In a `LevelWriteHost` implementation, change `source: usize` to `source: SoundSource` as well. `HitHost::play_sound_at` and `play_sound_from` already take `SoundSource` and need no call-site changes.
- `level.container_stack(at, slot).map(|stack| stack.count())` -> `read.with_container_stack(at, slot, |stack| stack.count())`, where `let read: &dyn LevelHost = level;` also upcasts a `LevelTicksHost`, `LevelRandomHost` or `LevelWriteHost`. To keep the old owned result, use `read.with_container_stack(at, slot, |stack| stack.project()).flatten()`. The view itself cannot escape that callback. If implementing `LevelHost`, replace `container_stack` with `lend_container_stack(&self, at: BlockSide, slot: usize, read: &mut dyn for<'a> FnMut(ItemStackView<'a>)) -> Option<()>`: call `read` once and return `Some(())` on success, or return `None` without calling it for empty or unavailable storage. Game-side `ItemsBackend` implementations switch to that same loan signature. The public `ITEMS` capability still returns an owned `ItemResource` from `resource(host, slot)`; it does not require a change at capability call sites.
- `host.block_in_tag(block, "minecraft:logs")` and `level.block_in_tag(block, "minecraft:logs")` -> resolve `let logs = registrar.tag_key("minecraft:logs");` in `Hooks::register` (or `tags.key(&Identifier::parse("minecraft:logs")?)?` at a non-hot boundary) and call `block.is_in_tag(host.tags(), logs)` (or `state.is_in_tag(level.tags(), logs)` / `host.tags().block_in_tag(block, logs)`). Remove `block_in_tag` from custom `LevelHost` implementations.
- `host.fluid_in_tag("minecraft:water", "minecraft:water")` and `level.fluid_in_tag("minecraft:water", "minecraft:water")` -> resolve a `FluidKey` (or read a `FluidState`) and a `TagKey` once, then call `fluid.is_in_tag(host.tags(), water_tag)` (or `fluid_state.is_in_tag(level.tags(), water_tag)` / `host.tags().fluid_in_tag(fluid, water_tag)`). For items, `item.is_in_tag(host.tags(), tag)` is equivalent to `host.tags().is_in_tag(item, tag)`. Implement `Tags::block_in_tag` and `Tags::fluid_in_tag` on custom `Tags` implementations, and remove `fluid_in_tag` from custom `LevelHost` implementations.
- `context.block_in_tag(pos, "minecraft:dirt")` inside `FeatureType::place` -> retain `let dirt = registrar.tag_key("minecraft:dirt");` in `Hooks::register` and call `context.block_in_tag(pos, self.dirt)`.
- `host.state_outline(state)` -> `state.outline(&host.block_states())` (with `HostBlockStates` in scope, or `state.outline(&level.block_states())` in a restricted level). It borrows `&[[f64; 6]]`; call `.map(|boxes| boxes.to_vec())` on the result only if you need an owned copy.
- `host.state_fluid_state(state)` and `level.state_fluid_state(state)` -> `state.fluid_state(&host.block_states())` or `state.fluid_state(&level.block_states())`. Remove `state_fluid_state` from custom `LevelHost` implementations.
- `host.fluid_is_same(a, b)`, `host.fluid_bucket(f)`, `host.fluid_pickup_sound(f)` and `host.fluid_empty_sound(f)` -> resolve `FluidKey`s once through `Registrar::fluid_key` (or `host.fluid_key(id)` for a runtime name, checking for `None` there). Then use `a.is_same(&states, b)`, `f.bucket(&states)`, `f.pickup_sound(&states)` and `f.empty_sound(&states)` with `let states = host.block_states();` (or `level.block_states()`).
- `TagsHost::unresolved_fluid_id(host, fluid)` -> `LevelFluidsHost::unresolved_fluid_id(host, fluid)`. If you import the trait directly, import `prelude::LevelFluidsHost`; move any custom host override to that trait and exclude `level_fluids` from its default `impl_host_areas!` implementation. `fluid.id(host)` and ordinary `host.unresolved_fluid_id(fluid)` calls keep the same `String` result and world-only availability.
"""
