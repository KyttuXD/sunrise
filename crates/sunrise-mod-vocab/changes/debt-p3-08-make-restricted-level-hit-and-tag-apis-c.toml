why = "Property writes now share the same BlockUpdateFlags as whole-state writes, matching the flag combination accepted by vanilla Level.setBlock and used by NeoForge IBlockExtension.onDestroyedByPushReaction. Level sounds now take SoundSource like vanilla LevelAccessor.playSound and Level.playSound. Numeric representations stay in the engine; the sound queue and seed timing are unchanged. Restricted levels and the game's item capability now lend the same side-local resident slot instead of copying it up front. That follows vanilla Container.getItem's resident stack and NeoForge WorldlyContainerWrapper.getResource/getAmountAsLong through VanillaContainerWrapper's slot wrappers, without granting the read-only view authority to unpack loot."
migrate = """
- `level.set_block_property(pos, key, value, raw_flags)` -> `level.set_block_property(pos, key, value, flags)` with `flags: BlockUpdateFlags`. Make the same last-argument change in `host.set_block_property_with(pos, key, value, flags)` and in trait implementations. Use `BlockUpdateFlags::NONE` for `0`, `BlockUpdateFlags::CLIENTS` for `UPDATE_CLIENTS` (`2`), and `BlockUpdateFlags::NEIGHBORS | BlockUpdateFlags::CLIENTS` for `UPDATE_ALL` (`3`). If a call already combines `BlockUpdateFlags`, pass the combination without `.bits()`. The three-argument `host.set_block_property(pos, key, value)` is unchanged.
- `level.play_sound(sound, at, source.index(), volume, pitch)` -> `level.play_sound(sound, at, source, volume, pitch)` with `source: SoundSource`; use `SoundSource::Blocks` for the old ordinal `4`, for example. In a `LevelWriteHost` implementation, change `source: usize` to `source: SoundSource` as well. `HitHost::play_sound_at` and `play_sound_from` already take `SoundSource` and need no call-site changes.
- `level.container_stack(at, slot).map(|stack| stack.count())` -> `read.with_container_stack(at, slot, |stack| stack.count())`, where `let read: &dyn LevelHost = level;` also upcasts a `LevelTicksHost`, `LevelRandomHost` or `LevelWriteHost`. To keep the old owned result, use `read.with_container_stack(at, slot, |stack| stack.project()).flatten()`. The view itself cannot escape that callback. If implementing `LevelHost`, replace `container_stack` with `lend_container_stack(&self, at: BlockSide, slot: usize, read: &mut dyn for<'a> FnMut(ItemStackView<'a>)) -> Option<()>`: call `read` once and return `Some(())` on success, or return `None` without calling it for empty or unavailable storage. Game-side `ItemsBackend` implementations switch to that same loan signature. The public `ITEMS` capability still returns an owned `ItemResource` from `resource(host, slot)`; it does not require a change at capability call sites.
"""
