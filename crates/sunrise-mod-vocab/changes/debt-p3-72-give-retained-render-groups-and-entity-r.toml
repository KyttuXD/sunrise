why = "Retained render-group operations and entity residency now live only on `InstanceGroupRef` and `EntityRef`, removing duplicate and flat host methods. Retained groups are Sunrise-only; explicit draws follow vanilla 26.3's `SubmitNodeCollection.submitCustomGeometry` and NeoForge's `SubmitNodeCollection.submitSpecial`: submit the work, without deduplicating handles or counting calls that enqueue nothing. Group access follows handle generation and lifetime, not the caller's mod name; model/world retirement and owner-disable cleanup still apply. Vanilla's `Entity.isRemoved` checks for a removal reason, and NeoForge's `EntityEvent.EnteringSection` carries the moving entity itself. During a live section write the local client player is in place and a lent server mob is busy, not gone."
migrate = "Replace `host.instance_group_write(group, first, instances)` with `group.write(host, first, instances)`, `host.instance_group_set_len(group, len)` with `group.set_len(host, len)`, `host.instance_group_set_transform(group, transform)` with `group.set_group_transform(host, transform)`, and `host.instance_group_destroy(group)` with `group.destroy(host)`. Replace `host.entity_residency(entity)` with `entity.residency(host)`; in `entity_entering_section`, handle a lent server mob as `Busy`, not `Gone`. If you already use `InstanceGroupRef::write`, `set_len`, `set_group_transform`, or `destroy`, keep those calls. Keep using `WorldDrawContext::draw_instance_group`, but call it only once per intended draw: repeated submissions draw again, and empty or fully culled submissions do not spend the view's instance budget. Do not use `GroupError::Stale` as a caller-identity check; only share a group handle with mods that may write, resize, transform, draw, or destroy the group."
