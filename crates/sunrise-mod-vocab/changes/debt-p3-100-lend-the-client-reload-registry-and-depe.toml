why = "Client reload registration now lends the current reload's names, dependency edges and model-manager anchor instead of cloning them. This follows NeoForge's AddClientReloadListenersEvent and its SortedReloadListenerEvent.getRegistry, getGraph and getLastVanillaListener views. Listener order and the prepare/apply split are unchanged, as in vanilla's ReloadableResourceManager.createReload and SimpleReloadInstance.prepareTasks."
migrate = """
Replace `for id in listeners.get_registry()` with `for id in listeners.get_registry().iter()`
(`id: &Identifier`). Replace `for (first, second) in listeners.get_graph()` with
`for (first, second) in listeners.get_graph().iter()` (both endpoints are `&Identifier`).
If you need the old owned lists, use `get_registry().iter().cloned().collect::<Vec<_>>()`
or `get_graph().iter().map(|(first, second)| (first.clone(), second.clone())).collect::<Vec<_>>()`.
Otherwise clone only the IDs you need after the borrow ends. `listeners.get_last_vanilla_listener()`
now returns `&Identifier`; to pass it to a later `add_dependency` call, first bind
`let anchor = listeners.get_last_vanilla_listener().clone();` and then call
`listeners.add_dependency(first, anchor)` (or use it as the first argument to place a listener after it).
It still names the client model manager. Listener registration and owned apply closures are unchanged.
"""
