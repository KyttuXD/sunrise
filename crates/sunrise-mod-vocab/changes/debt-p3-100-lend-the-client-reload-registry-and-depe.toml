why = "Client reload registration now lends the current listener names, dependency edges and model-manager anchor instead of cloning them. This matches the borrowed server contract and NeoForge's AddClientReloadListenersEvent with SortedReloadListenerEvent.getRegistry, getGraph and getLastVanillaListener. The client anchor and dependency order are unchanged, as is the separation of prepare and apply at vanilla's ReloadableResourceManager.createReload and SimpleReloadInstance.createBarrierForListener."
migrate = """
For read-only loops, replace `for id in listeners.get_registry()` with `for id in listeners.get_registry().iter()` (`id: &Identifier`). \
Replace `for (first, second) in listeners.get_graph()` with `for (first, second) in listeners.get_graph().iter()` (both are `&Identifier`). \
If the loop calls `add_dependency` or `add_listener` on the same registry, collect an owned snapshot before the loop: \
`let ids = listeners.get_registry().iter().cloned().collect::<Vec<_>>();` or \
`let edges = listeners.get_graph().iter().map(|(first, second)| (first.clone(), second.clone())).collect::<Vec<_>>();`. \
Then loop over `ids` or `edges` by value and make the mutable registration calls in the loop body. \
Cloning inside a loop over either borrowed view does not end the iterator's borrow. \
`listeners.get_last_vanilla_listener()` now returns `&Identifier` to the model-manager ID. \
To pass the anchor to `add_dependency`, first bind `let anchor = listeners.get_last_vanilla_listener().clone();`, then call `listeners.add_dependency(anchor, id)` to run after it or `listeners.add_dependency(id, anchor)` to run before it."""
