ids = [
    "method:ClientReloadListeners::get_registry",
    "method:ClientReloadListeners::get_graph",
    "method:ClientReloadListeners::get_last_vanilla_listener",
]
why = "Following NeoForge's AddClientReloadListenersEvent and SortedReloadListenerEvent over vanilla's ReloadableResourceManager, client reload registration now lends the live registered names (ClientReloadRegistryView), dependency edges (ClientReloadGraphView) and vanilla anchor (&Identifier) instead of cloning them on each read, matching ServerReloadListeners. Client anchor (VanillaClientListeners::model_manager()), dependency ordering and prepare/apply ownership are unchanged."
migrate = """
For read-only loops, replace `for id in listeners.get_registry()` with `for id in listeners.get_registry().iter()` (`id: &Identifier`). \
Replace `for (first, second) in listeners.get_graph()` with `for (first, second) in listeners.get_graph().iter()` (both are `&Identifier`). \
If the loop calls `add_dependency` or `add_listener` on the same registry, collect an owned snapshot before the loop: \
`let ids = listeners.get_registry().iter().cloned().collect::<Vec<_>>();` or \
`let edges = listeners.get_graph().iter().map(|(first, second)| (first.clone(), second.clone())).collect::<Vec<_>>();`. \
Then loop over `ids` or `edges` by value and make the mutable registration calls in the loop body. \
Cloning inside a loop over either borrowed view does not end the iterator's borrow. \
`listeners.get_last_vanilla_listener()` now returns `&Identifier` (still `VanillaClientListeners::model_manager()`); \
clone it before a later mutable registration call if you need to pass the ID to `add_dependency`."""
