why = """
Borrow decoded play packets synchronously instead of cloning packet IDs, plugin channel names,
and payload bytes per invocation, and replace the duplicated portable play-packet encoders
(and their non-vanilla 8 KiB builder cap) with the client host's real protocol encoder.

Follows vanilla Minecraft 26.3 and NeoForge 26.3:
- Vanilla `Connection.channelRead0` / `Connection.genericsFtw` hand each decoded packet directly
  to the packet listener and `Connection.send` hands the outgoing packet directly to the
  connection without cloning. NeoForge's `Connection` patch has no raw play-packet observer
  counterpart (`ClientCommonPacketListenerImpl.handleCustomPayload` routes registered payloads
  only). Sunrise's `client_packet` and `client_packet_send` (version 3) now borrow immutable
  callback-lifetime `ClientPacket<'a>` and `ClientPayload<'a>` views (`ClientPayload` loses
  `Wire`) while keeping the existing filters, ordering, and no-subscriber fast path, and contain
  listener panics per callback (log + error toast naming the mod, disabling only that callback
  for the session while later eligible listeners still run and failed send listeners leave the
  last accepted cancellation unchanged).
- Typed serverbound play packets now go through `NetworkClientHost::build_play_packet` using
  `sunrise-protocol`'s real play packet `STREAM_CODEC`s: `ServerboundUseItemPacket`,
  `ServerboundUseItemOnPacket`, `ServerboundPlayerActionPacket`, `ServerboundInteractPacket`
  with `Vec3.LP_STREAM_CODEC` (`LpVec3`, which maps `NaN` to `0.0` and clamps large/infinite
  values to `±1.717_986_918_3e10`), `ServerboundAttackPacket`,
  `ServerboundPickItemFromBlockPacket`, `ServerboundPickItemFromEntityPacket`,
  `ServerboundSignUpdatePacket` (`Utf8String.write` enforces `MAX_STRING_LENGTH = 384`
  UTF-16 code units on both checked publication and builder encoding),
  `ServerboundMovePlayerPacket` (`packFlags`), and `BlockPos.STREAM_CODEC` (`asLong` masks off
  higher coordinate bits rather than refusing them). Field validation follows vanilla's codecs
  and server handlers (`ServerGamePacketListenerImpl.handleMovePlayer` / `containsInvalidValues`,
  which refuses `NaN` positions and non-finite movement angles while writing infinite positions
  unchanged, and `ServerGamePacketListenerImpl.handleUseItemOn`, which checks finite hit cursor
  coordinates). `ServerGamePacketListenerImpl.handleUseItem` wraps both transmitted angles before
  use; `Entity.absSnapRotationTo`/`setYRot`/`setXRot` keep the previous rotation on each non-finite
  axis and clamp finite pitch to ±90°. NeoForge's play listener patch leaves this handling intact.
- Stateless construction works on the first `AddClientReloadListenersEvent` and the client hosts
  that cannot borrow the game or its connection. Like NeoForge's client reload event, the callback
  does not require a world. Connection-dependent container clicks return a typed refusal when the
  phase or a restricted client host cannot offer connection access.
- Removes the arbitrary 8 KiB builder body cap; whole-packet framing limits are enforced at
  publication preparation in `send_packet` using vanilla `Varint21LengthFieldPrepender`
  (`MAX_VARINT21_BYTES = 3`, 2,097,151-byte encoded limit) and `CompressionDecoder`
  (`MAXIMUM_UNCOMPRESSED_LENGTH = 8388608`, 8 MiB uncompressed limit). `PacketBuildError` now
  implements `AccessRefusal` for the host-owned `build_play_packet` boundary.
"""
migrate = """
Rebuild native mods against version 3 of `Hooks::client_packet` and `Hooks::client_packet_send`
and migrate borrowed packet views and play-packet builders as follows:

1. `client_packet` and `client_packet_send` listeners (version 3):
   - Keep the existing `ClientPacketEvent<'_>` and `ClientPacketSendEvent<'_>` callback
     signatures; `event.packet` now borrows an immutable `&'a ClientPacket<'a>` whose fields are
     `id: &'a Identifier` and `custom_payload: Option<ClientPayload<'a>>` (`channel: &'a str`,
     `data: &'a [u8]`).
   - Copy only the values you need to retain after the callback returns: `event.packet.id.clone()`,
     `payload.channel.to_owned()`, and `payload.data.to_vec()`. `ClientPayload` no longer
     implements `Wire`.
   - Update any direct view construction (for example in tests) from owned values to borrows:
     `ClientPacket::new(&id, custom_payload)` and
     `ClientPayload::new(channel.as_str(), data.as_slice())`.
   - Finish a send listener normally for its answer to count: return `Flow::Cancel` to drop the
     packet, or use `#[listener(receive_cancelled)]`, set `event.cancelled = false`, and return
     `Flow::Continue` to clear a prior cancellation. Neither setting `event.cancelled` before
     panicking nor a phase refusal alters cancellation, and reassigning `event.packet` never
     changes what later listeners or the game observe.

2. Typed play packet builders (`ServerboundPlayPacket::<name>` -> `host.build_play_packet(&PlayPacketRequest::...)`):
   Replace every portable constructor call with a named-field `PlayPacketRequest` passed to
   `host.build_play_packet(&...)` (available on `&dyn ClientHost` in setup, reload, and world,
   including the first reload before Game exists):
   - `ServerboundPlayPacket::use_item(hand, sequence, yaw, pitch)`
     -> `host.build_play_packet(&PlayPacketRequest::UseItem { hand, sequence, yaw, pitch })`
   - `ServerboundPlayPacket::use_item_on(hand, pos, face, cursor, inside, world_border, sequence)`
     -> `host.build_play_packet(&PlayPacketRequest::UseItemOn { hand, pos, face, cursor, inside, world_border, sequence })`
   - `ServerboundPlayPacket::player_action(action, pos, direction, sequence)`
     -> `host.build_play_packet(&PlayPacketRequest::PlayerAction { action, pos, direction, sequence })`
   - `ServerboundPlayPacket::interact(entity, hand, location, sneaking)`
     -> `host.build_play_packet(&PlayPacketRequest::Interact { entity, hand, location, sneaking })`
   - `ServerboundPlayPacket::attack(entity)`
     -> `host.build_play_packet(&PlayPacketRequest::Attack { entity })`
   - `ServerboundPlayPacket::pick_item_from_block(pos, include_data)`
     -> `host.build_play_packet(&PlayPacketRequest::PickItemFromBlock { pos, include_data })`
   - `ServerboundPlayPacket::pick_item_from_entity(entity, include_data)`
     -> `host.build_play_packet(&PlayPacketRequest::PickItemFromEntity { entity, include_data })`
   - `ServerboundPlayPacket::sign_update(pos, front, lines)`
     -> `host.build_play_packet(&PlayPacketRequest::SignUpdate { pos, front, lines })`
   - `ServerboundPlayPacket::move_player_pos(pos, on_ground, horizontal_collision)`
     -> `host.build_play_packet(&PlayPacketRequest::MovePlayerPos { pos, on_ground, horizontal_collision })`
   - `ServerboundPlayPacket::move_player_pos_rot(pos, yaw, pitch, on_ground, horizontal_collision)`
     -> `host.build_play_packet(&PlayPacketRequest::MovePlayerPosRot { pos, yaw, pitch, on_ground, horizontal_collision })`
   - `ServerboundPlayPacket::move_player_rot(yaw, pitch, on_ground, horizontal_collision)`
     -> `host.build_play_packet(&PlayPacketRequest::MovePlayerRot { yaw, pitch, on_ground, horizontal_collision })`
   - `ServerboundPlayPacket::move_player_status_only(on_ground, horizontal_collision)`
     -> `host.build_play_packet(&PlayPacketRequest::MovePlayerStatusOnly { on_ground, horizontal_collision })`

   Note the vanilla-aligned validation changes: `UseItem` writes yaw/pitch as supplied, including
   non-finite values, which the server ignores independently on each axis while applying finite
   wrapped angles and clamping pitch. `Interact.location` uses vanilla `Vec3.LP_STREAM_CODEC`
   (`NaN -> 0.0`, clamping to `±1.717_986_918_3e10`) instead of returning `NonFinite`;
   `MovePlayerPos` / `MovePlayerPosRot` refuse `NaN` positions while allowing infinite positions.
   For `UseItemOn`, `PlayerAction`, `PickItemFromBlock`, and `SignUpdate`, do not rely on
   `OutOfRange` for a block position: the wire uses signed low 26-bit X/Z and low 12-bit Y
   coordinates (for example, X = 33_554_432 decodes as −33_554_432). Keep handling
   `SignLineTooLong` with `field: "lines[i]"` for a sign line longer than 384 UTF-16 code units.
   Handle framing bounds at `send_packet` (`SendPacketError::FrameTooLarge`) instead of an 8 KiB
   builder cap.

3. `container_click` wrong-phase / no-backend error:
   - Keep calling `host.container_click(&request)`. On the game host, a call outside World used to
     unwind with a phase refusal. Now handle this match arm on the returned `Result`:
     `Err(PacketBuildError::Unavailable { packet, field }) if packet == "play_packet" && field == "host"`.
   - Engine client hosts without access to a connection (first-load reload registration, pack
     discovery, and a borrowed entity section) explicitly return the same typed error. The
     `NoBackend::no_backend()` constructor alone does not implement the method for custom host
     doubles; implement `NetworkClientHost::container_click` in a double that needs to return it.
   - On the game host in World, keep handling the connection error (`packet == "container_click"`,
     `field == "connection"`) if a request passes wire preflight but no connection is joined.
     The signature, live-connection behavior, and
     `ServerboundPlayPacket::validate_container_click_limits` preflight are unchanged.
"""
