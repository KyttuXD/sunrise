why = """
NeoForge's RegisterTicketControllersEvent.register binds each TicketController's LoadingValidationCallback directly at registration; TicketController.forceChunk and ForcedChunkManager.forceChunk use the registered controller's id. Sunrise keeps save names and slots for persistence only and requires a handle bearing the installed registration's identity for active operations, so passing a handle shares authority but knowing its name does not. ForcedChunkManager.readStoredTickets and ForcedChunkManager.activateAllDeactivatedTickets (alongside vanilla TicketStorage.fromPacked, packTickets, activateAllDeactivatedTickets, addTicket and removeTicket) stage saved rows per controller and lend only that controller's rows to its bound validator in the actual server level before activating survivors; TicketHelper.getBlockTickets and TicketHelper.getEntityTickets return unmodifiable maps of the original tickets that remain unchanged after removals during the callback.

NeoForge's FarmlandWaterManager.addAABBTicket and hasBlockWaterTicket issue and query in-process SimpleTicket handles without a synthetic column quota. SimpleTicket.invalidate removes a ticket by identity rather than caller name. NeoForgeEventHandler.onChunkUnload calls FarmlandWaterManager.removeTickets, and SimpleTicket.unload invalidates the whole ticket only when its master chunk (nearest the box center) unloads. Disabled installed mods still cannot add new tickets; retaining cleanup attribution for enabled callers preserves disable cleanup without using caller identity to authorize removal.

Sunrise originally introduced mod chunk tickets in 93b772a0e2c, named ticket controllers and the global validate_tickets broadcast in 5168e281cc6, built-in startup ticket restoration in 3e38b3a7704/463fa47f3f7, and transient farmland water tickets with a 65,536-column cap in 618e2feac03. This change removes the validate_tickets broadcast hook and ValidateTicketsEvent, binds validation callbacks per controller, lends borrowed BTreeMap views of original staged rows, authorizes chunk-ticket operations by the issued TicketController handle and water-ticket removal by the issued WaterTicket handle, removes Wire from WaterTicket, and indexes valid farmland water boxes without a column quota while preserving dimension, chunk-loading, persistence, built-in startup activation, and redelivery lifetimes. A panic in a validator disables only that controller's validator for the session; phase refusals report without disabling; removals already made still apply."""
migrate = """
Replace `r.register_ticket_controller(name, false)` with `r.register_ticket_controller(name, None)`. Replace `r.register_ticket_controller(name, true)` and your `Hooks::validate_tickets` implementation with `r.register_ticket_controller(name, Some(Arc::new(move |host, level, tickets| { ... })))`, capturing any per-controller state or behavior in each controller's closure and deleting the `event.controller` match and `ValidateTicketsEvent` import.

Inside the validator closure, replace `event.dimension` with `level.dimension().id(host)` (which returns `Option<&str>`) or compare `level.dimension()` against `DimensionKey`, and replace `event.validation` with the direct `tickets: &mut dyn TicketValidation` argument. Update `tickets.block_tickets()` and `tickets.entity_tickets()` callers from owned `Vec` pairs to borrowed `&BTreeMap<[i32; 3], TicketSet>` and `&BTreeMap<u128, TicketSet>` views (iterate with `.iter()` or `.keys().copied()`, or collect keys to drop before calling `remove_*`); those borrowed maps show the original staged tickets for the entire callback even after removals, while removals update the staged rows immediately.

Keep the issued `TicketController` handle returned by `register_ticket_controller` (for example in a `OnceLock` or shared struct) and pass it to the same `chunk.set_mod_forced(host, controller, owner, forced, natural_spawning)` and `level.mod_forced_chunks(host, controller)` calls. To delegate, pass the handle itself, not an id from `controller.id()`, which is only a name. Stop using the hidden `from_id`, `from_slot`, `slot` or test `testing::ticket_controller` lookup; a test can retain the registrar's return value just like a mod. Replace any direct call through a hidden `controller.validator()` / `RegisteredTicketValidator::call` with a separate function your own bound closure calls, if you need to reuse your own validation logic. The engine invokes retained validators only when activating staged saved tickets. Do not remove a ticket merely because `level.block(host, owner)` returns `None`; the owner chunk may still be unloaded. Check authoritative saved ownership, or only prune when `Some(block)` confirms the owner block has changed.

`WaterTicket` no longer implements `Wire`: never serialize or persist it. Retain the issued `WaterTicket` handle in-process and call `ticket.remove(host)` from any holder that has it. It returns `false` after the master chunk or its level unloads, the creating installed mod is disabled, or the ticket is already removed. Reissue transient watered areas with `level.add_water_ticket(host, min, max)` on `level_load` or a block entity's load listener instead of reusing an expired handle. Adding works without a mod-callback caller context and has no column cap, but returns `None` when the installed caller is disabled. `level.has_water_ticket(host, pos)` checks remaining coverage without loading chunks or calling mod predicates."""
