ids = ["hook:break_progress_positions", "type:BreakProgressPositionsEvent", "method:BlockPart::break_progress_positions"]
why = "Break-progress positions are submitted one at a time. The eight-block radius from the cracked block and the 64-position trim were unrelated to rendering. Vanilla ClientLevel.destroyBlockProgress and ClientLevel.removeBlockBreakingProgress track the lifetime; LevelExtractor.extractBlockDestroyAnimation applies camera culling and uses the highest stage at each position as ordered by BlockDestructionProgress.compareTo. NeoForge's ClientLevel and LevelExtractor patches add no separate break-progress position bounds."
migrate = "Keep the same BlockPart::break_progress_positions(host, event) method and call (event.add_position)(pos) instead of event.positions.push(pos). Replace event.positions.extend(positions) with a loop calling (event.add_position)(pos) once per BlockPos. There is no editable reply list. The origin is included automatically, and the renderer applies its usual eligibility checks and uses the highest live stage per position."
