ids = ["method:prelude::ItemsHost::item_from_snbt"]
why = "Vanilla's TagParser.parseCompoundFully and NeoForge's JsonUtils.readNBT parse text without NbtAccounter, which NbtIo.readUnnamedTag uses for binary input. ItemStack.MAP_CODEC narrows the NbtOps number with Codec.INT before checking the count range. DataComponentPatch.PatchKey.CODEC resolves registered types and dispatches to their saved codecs, so invalid values such as negative damage are refused, not changed into another value. The mod host uses the shared saved codec and logs its refusal reason."
migrate = "Keep calling host.item_from_snbt(snbt) and matching Some(stack) or None. Remove caller-side length checks copied from the binary NBT quota. When a patch is refused, use the registered component ID and a value accepted by its saved codec (for example, supply nonnegative damage instead of -1). On None, check the log for the syntax, item or component diagnostic. Binary reads still use their own quotas."
