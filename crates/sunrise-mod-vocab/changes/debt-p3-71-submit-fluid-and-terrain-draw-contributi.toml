why = """
`BlockEntityDrawContext::fluid_box` and `BlockEntityDrawContext::terrain_model` previously enforced invented geometry budgets (1,048,576-block fluid coordinates, 65,536-quad cap, `uv_shrink_ratio` clamped to `0.0..=1.0`, singular-pose refusal, unmatched `uv_shift` refusal) and ran atomic preflight scans that discarded the entire draw on any single invalid primitive. Vanilla 26.3 (`FluidRenderer.tesselate`, `FluidStateModelSet.get`, `TextureAtlas.getSprite`, `BlockModelFeatureRenderer.buildGroup` and `putQuad`, `SubmitNodeCollector`, `PoseStack.Pose.scale` and `transformNormal`, `VertexConsumer.putBakedQuad`) and NeoForge (`CustomFluidRenderer.renderFluid`, `AddSectionGeometryEvent.SectionRenderingContext.getOrCreateChunkBuffer`) emit valid geometry per quad with `minecraft:missingno` sprite fallback and no arbitrary coordinate or quad budgets.

`FluidBoxError` and `TerrainModelError` are removed. `BlockEntityDrawContext::fluid_box` now returns `()`, drawing nothing for empty/unresolved fluids or reversed/non-finite bounds, falling back to `minecraft:missingno` when a registered fluid has no look or sprite, and submitting valid quads individually within the actual vertex and index byte capacity shared by the frame. `BlockEntityDrawContext::terrain_model` now returns `Result<(), ModelError>` (matching `BlockEntityDrawContext::model`), failing only on stale or unknown handles while emitting valid quads individually using their baked sprite layers unless explicitly shifted. A missing shift target uses the blocks atlas's missing sprite; an unmatched source is a no-op. Solid and cutout shading uses the scoped normal transform, and a quad with an unrepresentable normal does not affect its unshaded or translucent neighbors. CPU model copies and retained groups share the same quad submission path and keep the quads that fit.
"""
migrate = """
Remove `?` and error handling on `BlockEntityDrawContext::fluid_box(...)`, which now returns `()` directly, and delete references to `FluidBoxError`.

Update callers of `BlockEntityDrawContext::terrain_model(...)` to handle `Result<(), ModelError>` instead of `Result<(), TerrainModelError>` (for example, replace `TerrainModelError::Model(err)` matches with `err: ModelError` and remove `TerrainModelError::Refused` arms). Delete references to `TerrainModelError`.

No call change for `WorldDrawContext::draw_model_instances(...)` or `draw_instance_group(...)`. Their results still report copy admission; on the CPU route only complete quads that fit the shared frame buffers are drawn.
"""
