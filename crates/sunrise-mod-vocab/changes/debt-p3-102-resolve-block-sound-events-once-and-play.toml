why = "Block sound event names are validated and qualified once, following vanilla Identifier.parse. SoundType.getBreakSound and getPlaceSound select a single event, as do NeoForge IBlockExtension.getSoundType and BlockItem.place at their playback sites. A missing event and the action's volume and pitch go to the usual playback path, as in SoundEngine.play, instead of reverting an entire answer. A panicking part loses this callback for the session; its unfinished edit is not played."
migrate = "Replace raw Arc<str> assignments to BlockSoundType.break_sound, step, place, hit and fall with SoundEventKey::parse(name) during load, handle None as invalid identifier syntax, then clone the retained key into event.sound.<slot> in BlockPart::sound_type. Bare names now use minecraft. To read a name from host.block_states().sound(state) or an event, call sound.<slot>.as_str(); sound.event(event.cause) borrows the requested key. BlockSoundType no longer implements Wire. Define your own Wire payload with the fields the receiver actually needs (for example a String for the selected event); parse received text at that payload's boundary."
