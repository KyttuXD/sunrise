ids = ["type:MenuDataRefusal.WrongOwner"]
why = "Data belongs to the live menu, not the registering mod. Vanilla AbstractContainerMenu.setData writes the menu's indexed slot and AbstractContainerMenu.broadcastChanges sends changed values through its synchronizer. NeoForge's ServerPlayer menu synchronizer changes the packet in broadcastDataValue for a supported client, not who can set the slot. Sunrise keeps server authority, live window and index checks, and commit-time synchronization."
migrate = "Keep calling MenuRef::set_data_slot(host, index, value) on the server. Remove any MenuDataRefusal::WrongOwner match arm and any check for the registering mod that was only there to avoid that refusal. Acquire the live MenuRef from PlayerRef::container_menu or the open event and use its declared data index; Unsupported, Stale, and InvalidIndex still apply."
