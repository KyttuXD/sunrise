ids = [
    "behaviour:local_sound_placement",
    "behaviour:local_sound_timing",
    "behaviour:local_sound_levels",
    "behaviour:muffle_sound_exemptions",
    "hook:play_sound",
]
why = "Vanilla 26.3 ClientLevel.playLocalSound hands off to SoundEngine.play or playDelayed without a world-border or one-minute admission limit. Channel.setSelfPosition takes float coordinates; readable positions still pan at extreme distances. SoundEngine.calculateVolume and calculatePitch process final scaled parameters, and SoundEngine.requiresManualLooping tests for a positive repeat delay. NeoForge's PlaySoundEvent.setSound passes the replacement instance to that same playback path; only a null replacement cancels before engine checks. Sunrise's muffle has no vanilla counterpart; its mixer consumes an exemption set without a fixed count. Invalid playback edits are logged each time. A panicking play_sound listener is disabled for the session and named in the log and error toast without stopping the remaining callbacks."
migrate = "Pass the desired u32 delay directly to host.play_local_sound(&sound, after) instead of bounding it to one minute. Pass positions directly to SoundPlay::at or sound.move_to(host, position) if they stay finite in float mixer coordinates; for a relative sound set SoundPlay.position or call move_to with an offset from the listener. Pass finite base volume and pitch to SoundPlay::with_volume and with_pitch or to play_sound's editable SoundPlay fields, and pass finite base pitch directly to sound.set_pitch(host, pitch). The engine computes the final playback values. If your play_sound listener used a negative volume or nonpositive pitch to refuse a play or stop a live channel, use *event.sound = None instead. Pass zero or a negative repeat delay to SoundPlay::looping(delay) for automatic looping, and a positive delay for a gap. Pass a finite target to sound.fade(host, volume, ticks); zero or less stops it at the end of the fade. Pass the full namespaced exemption list to host.muffle_sounds(amount, lowpass, ticks, exempt) in one call. If you used any former refusal to enforce your own policy, enforce it in your mod instead. Fix a panicking play_sound listener and restart Sunrise to enable it again; invalid numeric edits do not disable the listener."
