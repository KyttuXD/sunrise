ids = ["behaviour:client_fireworks_explosions"]
why = "Vanilla 26.3 ClientLevel.createFireworks passes the visual list to FireworkParticles.Starter without a count check, while Fireworks.MAX_EXPLOSIONS, CODEC and STREAM_CODEC keep the 256-explosion item-component limit. ClientHost::create_fireworks now makes that same distinction. The starter keeps Java int tick arithmetic and the existing ParticleEngine lifecycle; NeoForge's FireworkParticles.Starter.tick patch extends shape dispatch, not admission or timing."
migrate = "No signature or type changes. Keep calling ClientHost::create_fireworks(&request); pass the complete visual list in request.explosions instead of truncating it or splitting it into separate requests at 256. Keep the 256-explosion limit when creating a Fireworks item component."
