ids = ["type:ItemPlace"]
why = "ItemPlace is a process-local handle (its Mod variant previously relied on leaking decoded strings into a process-global static-string table). Static-string decode interning (wire::intern, impl Wire for &str, and &'static str fields in #[derive(Wire)]) has been removed so Wire decodes only owned text and never leaks decoded input into process-global storage. This is a Sunrise-only Wire cleanup with no vanilla or NeoForge counterpart."
migrate = "Keep ItemPlace values in-process rather than encoding or decoding them with Wire. If a custom typed payload needs to refer to a target, define an owned #[derive(Wire)] record containing only the needed fields (such as String, u128, [i32; 3], or usize) instead of embedding ItemPlace. Replace &str or &'static str fields in #[derive(Wire)] types and Reader::decode::<&str> or Reader::decode::<&'static str> calls with owned string types (String, Cow<'static, str>, Box<str>, or Arc<str>). Writer::put(\"...\") via Put for str remains available for encoding string slices."
