why = "Follows NeoForge 26.3 (`net.neoforged.neoforge.client.extensions.common.IClientItemExtensions`, `RegisterClientExtensionsEvent`, `ClientExtensionsManager`) and vanilla 26.3 (`net.minecraft.client.renderer.entity.layers.EquipmentLayerRenderer`, `net.minecraft.client.model.geom.EntityModelSet.bakeLayer`, `net.minecraft.client.model.geom.ModelPart`, `net.minecraft.client.renderer.blockentity.BlockEntityRenderer.submit`, `net.minecraft.client.renderer.block.BlockModelRenderState.submitModel`). Registration errors now stay local to the failing `ClientItemExtensionsRegistrar` call instead of rolling back all valid models, textures and providers across a reload; model names no longer require the registering mod's namespace, and baking an equipment `ModelPart` tree drops the synthetic 32-level depth cap. `register_client_item_extensions` is bumped to version 4 to reflect these semantics and the per-reload binding contract. During equipment draws, `ClientItemExtensions` callbacks now borrow the live `&ItemStackView<'_>` and asset `&EquipmentLayer<'_>` (`layer.texture: &str`) without cloning the stack per frame, `default_dye_color` reads only the stored dye override via `ItemStackView::get`, and resource load binds only the atlas sprites explicitly requested by mods rather than prebinding the entire atlas. `ArmorModelRef`, `ArmorTextureRef`, `EquipmentLayer` and `EquipmentLayerType` are local to a client resource load or draw and no longer implement `Wire`; `Attached::enabled` for item extensions is removed in favour of shared callback ownership. The item-specific sticky `failed` latch is removed: non-panic refusals, invalid stacks and stale references report on each use without disabling later valid draws, while a panic discards that piece's custom layers, logs with an error toast naming the mod, and disables that mod's provider for that item for the session (across reloads). Mob equipment draws use the authoritative worn stack, including gear overlays for trim and enchantments, and submit the selected override's reload-bound UVs. Worn geometry stays flat through submission and destruction, preserving `ModelPart.render`'s transform and visibility order without relying on the call stack. Vanilla entity model layers for `ClientHost::bake_layer` are indexed at client resource load and reload instead of reading from disk on lookup; a bad definitions file fails staging rather than replacing active models. `BlockEntityDrawContext::block` accepts an already-resolved `BlockState` directly instead of reparsing property string slices every frame, and shares the generation's seeded block model and atlas bindings with the existing state-model resolver."
migrate = '''
- **Worn equipment callbacks (`ClientItemExtensions`)**:
  - In `armor_layer_model`, `default_dye_color`, `armor_layer_tint_color` and `armor_texture`, replace `stack: &ItemStack` with `stack: &ItemStackView<'_>`. Read a single stored component override lazily with `stack.get(&descriptor)` (which does not consult item defaults); if you need the full component patch or an owned stack, call `stack.project()` and handle `None` with the callback's default result. For other borrowed `ItemStackView` sites, replace `view.project()?.get(&descriptor)` with `view.get(&descriptor)`.
  - Replace `layer: &EquipmentLayer` with `layer: &EquipmentLayer<'_>`. `layer.texture` is now `&str` (the asset's expanded sprite name before pack/CIT overrides) instead of `ArmorTextureRef`; compare `mymod:entity/equipment/humanoid/chest_inner`, not the asset JSON's `mymod:chest_inner`.
  - In `armor_texture`, replace the final parameter `default: ArmorTextureRef` with `default_texture: &str` to inspect the renderer's chosen texture name, and return `ArmorTextureRef::DEFAULT` instead of returning `default` to keep that selection. Return a reference from `event.extensions.register_texture(name)` for the current resource load only when overriding the texture; do not register default textures merely to inspect them.
- **Registration (`register_client_item_extensions` v4) and error isolation**:
  - Rebuild native mods that listen to `register_client_item_extensions` for hook version `4` (registrar method signatures are unchanged). Handle each `Err` returned by `event.extensions.register_model`, `register_texture` and `client_item_extensions` locally; an error no longer rolls back earlier successful registrations in the same reload. Duplicate item providers report both providers and keep the first. Model names may use any valid namespace.
  - Expect non-panic refusals, invalid stacks and stale model/texture references to be logged on each occurrence without disabling subsequent valid draws (a refused draw falls back to vanilla for that piece; a stale ref falls back to vanilla's model or the default texture for that layer). A panic in a provider callback discards that piece's custom layers, logs and shows an error toast naming the mod, and disables that mod's provider for that item for the rest of the session (including across reloads).
  - The engine-only `Attached::enabled` method on `Attached<dyn ClientItemExtensions>` is removed; register providers through `event.extensions.client_item_extensions(item, Arc::new(provider))` as before.
- **No `Wire` on local equipment draw types**:
  - Remove any `Wire` derive, encoding or decoding of `ArmorModelRef`, `ArmorTextureRef`, `EquipmentLayer<'_>` or `EquipmentLayerType`. Keep draw inputs within the callback and reacquire model/texture references on each resource load.
- **Named and worn model geometry**:
  - `host.bake_layer("minecraft:zombie#main")` keeps the same call and returns an owned tree from the prepared vanilla layer set. For custom geometry, use `event.register("mymod:golem#main", supplier)` in `register_layer_definitions`, then `host.bake_layer("mymod:golem#main")`; a resource pack does not supply named layer definitions.
  - Keep passing `&ModelPart` to `event.extensions.register_model`. No signature or pose change is needed, and a deep visible tree no longer needs splitting to fit the old synthetic bake limit.
- **Block-entity block drawing (`BlockEntityDrawContext::block`)**:
  - Replace `draw.block(block_key, &[("prop", "val")])` with `draw.block(state)` using a resolved `BlockState`. Resolve static states once via `BlockState::of(&host.block_states(), block_key, &[StateConstraint::new("prop", "val")])` (or pass `event.state` directly when drawing the block entity's own state).
'''
