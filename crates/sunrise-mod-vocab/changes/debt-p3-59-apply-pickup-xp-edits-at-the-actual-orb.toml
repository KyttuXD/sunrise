why = "NeoForge PlayerXpEvent.PickupXp.getOrb exposes the same live orb to every listener. Sunrise used to pass separate value and count outputs that could disagree with the orb itself. Version 2 gives listeners the live ExperienceOrbRef. Vanilla ExperienceOrb.playerTouch starts the delay and takes the orb only after the veto, passes its signed value to Mending, awards positive remaining XP, and then decrements the count and discards at zero. EnchantmentHelper.modifyDurabilityToRepairFromXp clamps negative repair results to zero, not the value passed to the enchantment. ExperienceOrb.readAdditionalSaveData decodes Count through ExtraCodecs.POSITIVE_INT after Number.intValue, and reads Value through TagValueInput.getShortOr. A surviving orb saves Value as a signed short and Count as a signed int, as in ExperienceOrb.addAdditionalSaveData."
migrate = "Rebuild Hooks::pickup_xp against version 2. Replace reads of event.value and event.count with event.orb.value(host) and event.orb.count(host). Replace assignments with event.orb.set_value(host, value) and event.orb.set_count(host, count); handle their Result. The count writer returns ExperienceOrbWriteError::InvalidCount for 0 or a value above i32::MAX without changing the orb. For the old numeric event.orb use event.orb.entity().id(). Writes are immediately visible to later listeners. Flow::Cancel stops the pickup and its delay, not a listener's writes. To discard instead of taking, call event.orb.entity().discard(host) and return Flow::Cancel."
