why = """Remove the three opt-in poll hooks (`entity_tick_listened`, `living_equipment_listened`, `hears_projectile_impacts`) so subscribing to the event itself drives preparation and dispatch directly, with zero preparation on the unsubscribed path.

Matches NeoForge 26.3 and vanilla 26.3 directly (none of which have separate opt-in poll events):
- `entity_tick_pre` (v4) and `entity_tick_post` (v4) follow NeoForge `EntityTickEvent.Pre` / `EntityTickEvent.Post` and vanilla `ServerLevel.tickNonPassenger`: `Told::from_subscriptions()` checks `enabled_listened(HookId::EntityTickPre)` and `enabled_listened(HookId::EntityTickPost)` directly, keeping Pre-only and Post-only preparation and per-entity list handbacks/yields independent on both logical sides and doing zero preparation when neither is subscribed.
- `living_equipment_change` (v3) follows NeoForge `LivingEquipmentChangeEvent` and vanilla `LivingEntity.tick -> detectEquipmentUpdates -> collectEquipmentChanges`: mob equipment change detection runs inside the mob's own tick before `aiStep` and `entity_tick_post` (never for a canceled tick), and mob, player, and armor-stand paths check `enabled_listened(HookId::LivingEquipmentChange)` directly on the server side while keeping vanilla equipment bookkeeping intact and skipping event preparation when unsubscribed.
- `projectile_impact` (v3) follows NeoForge `ProjectileImpactEvent` and vanilla `Projectile.hitTargetOrDeflectSelf` / `FireworkRocketEntity.tick`: `native_hears_impacts` checks `enabled_listened(HookId::ProjectileImpact)` directly on the server side at each impact moment (including inside `rocket_impact` without caching before `tick_rockets`) so flying projectile copies and impact dispatch are skipped when unsubscribed."""
migrate = """Remove implementations and imports of `Hooks::entity_tick_listened` / `EntityTickListenedEvent`, `Hooks::living_equipment_listened` / `LivingEquipmentListenedEvent`, and `Hooks::hears_projectile_impacts` / `HearsProjectileImpactsEvent`. Implementing `Hooks::entity_tick_pre` (version 4), `Hooks::entity_tick_post` (version 4), `Hooks::living_equipment_change` (version 3), or `Hooks::projectile_impact` (version 3) is now sufficient on its own to receive those events."""
