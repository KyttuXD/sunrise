why = """Subscribing to the event replaces the three opt-in polls.

- NeoForge's `EntityTickEvent.Pre` and `EntityTickEvent.Post` wrap vanilla `ServerLevel.tickNonPassenger` and `ClientLevel.tickNonPassenger`. A named entity gets only the subscribed phases; the game does not hand back the live entity lists just to dispatch an absent phase. Sleeping, item Parts and section crossings still run independently.
- NeoForge posts `LivingEquipmentChangeEvent` in vanilla `LivingEntity.collectEquipmentChanges`, called within `LivingEntity.tick` before `aiStep`. Mobs now report equipment changes at that point, before their Post; a canceled Pre does not reach equipment detection. Vanilla equipment bookkeeping still runs on its original path without listeners.
- NeoForge's `ProjectileImpactEvent` in `FireworkRocketEntity.onHit` runs after `Projectile.hitTargetOrDeflectSelf` decides deflection. A rocket checks its subscriptions at that hit rather than at the start of the flight loop. With no subscriber, it needs no impact payload or live-list reinsertion for dispatch."""
migrate = """Delete `Hooks::entity_tick_listened` and its `EntityTickListenedEvent` import; keep `Hooks::entity_tick_pre` or `Hooks::entity_tick_post` (both version 4), or both. Keep `entity_tick_each` registration for types you want told individually. Delete `Hooks::living_equipment_listened` and its `LivingEquipmentListenedEvent` import; keep `Hooks::living_equipment_change` (version 2). Move code that depends on the mob having finished its tick to `Hooks::entity_tick_post`: the equipment notice now arrives before AI and Post, and does not arrive on a canceled tick. Delete `Hooks::hears_projectile_impacts` and its `HearsProjectileImpactsEvent` import; keep `Hooks::projectile_impact` (version 3). Remove any manifest version pin for a deleted hook and update any pin for a retained hook to its new version."""
