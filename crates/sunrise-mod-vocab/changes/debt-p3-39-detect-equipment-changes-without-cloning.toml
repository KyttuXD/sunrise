why = "NeoForge posts LivingEquipmentChangeEvent inside vanilla LivingEntity.collectEquipmentChanges, after comparing each slot and before continuing to the next. Mobs share their equipment attribute comparison and server players notify from their body tick after item use. No separate advance scan or opt-in hook is needed. Comparisons borrow complete stacks, including gear overlays, and copy only changed slots into tick history. Version 2 lends a LivingRef, EquipmentSlot and lazy ItemStackView values instead of raw IDs, names and eagerly converted stacks."
