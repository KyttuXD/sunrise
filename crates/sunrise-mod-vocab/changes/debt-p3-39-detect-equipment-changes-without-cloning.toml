- Update `Hooks::living_equipment_change` callbacks for version 2:
  - `event.entity` is now `LivingRef` instead of `u32` (and `event.kind` is removed): read the id with `event.entity.id()`, the type key with `event.entity.entity().kind(host)` (and `kind.id(host)` if a canonical string is needed), or mutate equipment directly via `event.entity.set_equipment(host, ...)`.
  - `event.slot` is now `EquipmentSlot` (`MainHand`, `OffHand`, `Feet`, `Legs`, `Chest`, `Head`, `Body`, `Saddle`) instead of `&str`. Connected players now report all eight slots, including `Body` and `Saddle`, matching vanilla `PlayerEquipment`.
  - `event.from` and `event.to` are now `Option<ItemStackView<'_>>` instead of `Option<&ItemStack>`: read scalars directly with `stack.item()`, `stack.count()`, `stack.damage()` and `stack.damage_component()`, or call `stack.project()` when you need an owned `ItemStack` or its components.
- Rebuild against the new SDK so the package's `uses` list records `living_equipment_change` version `2`.
