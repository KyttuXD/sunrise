ids = [
    "method:NetworkClientHost::open_chat", "method:NetworkClientHost::send_chat",
    "method:Commands::run_command_with_output", "handle:EntityRef::run_command_with_output",
    "hook:chat_recipient", "hook:client_chat", "hook:command",
    "hook:screen_opening", "hook:screen_closing", "hook:screen_init_post",
]
why = "Vanilla Gui.setScreen and InBedChatScreen.onPlayerWokeUp replace the foreground once; NeoForge ScreenEvent.Opening, Closing and Init.Post follow the instance, not its class. LocalPlayer and ChatScreen own input policy. NeoForge's ChatScreen.keyPressed leaves a replacement screen open, and its ClientPacketListener.sendChat/sendCommand fire ClientChatEvent before signing and try the client command dispatcher before the wire. ServerboundChatPacket.STREAM_CODEC and Utf8String.write reject oversize input rather than truncate it. PlayerList.broadcastChatMessage logs and checks trust before each ServerPlayer.sendChatMessage; SayCommand and EmoteCommands resolve MessageArgument before broadcasting while keeping the signed body unchanged. Public announcements are chat, not command feedback. A panicking listener is reported and disabled without disabling another listener."
migrate = "Replace 'close the foreground screen, wait for Playing, then host.open_chat(text)' with host.open_chat(text). Opening may veto or replace the request; Closing identifies the outgoing foreground and Init.Post runs once for an accepted new chat instance even when the ID is unchanged. A listener can call host.open_chat(text) during submission without the old chat closing the new one afterward. Use host.send_chat(text) for direct play sends and host.open_chat(text) for player-controlled input. Trim or normalize explicitly if needed: send_chat no longer applies chat-box filtering or truncation. Handle Err for local wire or connection failure; Ok includes client-handled commands and intentional cancellations. Hooks::client_chat now sees direct messages before signing; return Flow::Cancel or clear the outgoing text to omit a send. Hooks::command sees direct slash commands without the leading slash; return Flow::Cancel if handled locally. Keep Hooks::chat_recipient's signature and return Flow::Cancel to omit that receiver's copy. It runs at delivery after the outer log, sees resolved display text, and sees nested public broadcasts the same way. Distinguish your nested message from its trigger. For Commands::run_command_with_output and EntityRef::run_command_with_output, replace checks for /say or /me lines in CommandResult.feedback with CommandResult.success to check execution; observe public delivery attempts via chat_recipient, not captured feedback."
