why = "ItemStorage now distinguishes a caller-requested stop from exhaustion without reading any more entries, preserving the short-circuit sided traversal of vanilla 26.3 HopperBlockEntity.suckInItems and NeoForge ResourceHandlerUtil.extractFirst. Registration now uses methods on the event rather than editable answer lists, following NeoForge RegisterEvent.register, RegisterBlockStateModels.registerDefinition and RegisterDebugRenderersEvent.register. Commands still register during vanilla Commands construction and ClientPacketListener.handleCommands, using scoped registration like NeoForge RegisterCommandsEvent.getDispatcher and RegisterClientCommandsEvent.getDispatcher. NeoForge RegisterPresetEditorsEvent.register replaces the earlier editor and logs the mod, and RegisterBlockStateModels.registerDefinition replaces the binding in vanilla ExtraCodecs.LateBoundIdMapper. Like NeoForge RegisterDimensionTransitionScreenEvent.registerIncomingEffect, registerOutgoingEffect and registerConditionalEffect, Sunrise detects an occupied dimension key without creating a registry entry; it assigns dimension slots only when publishing successful registrations. Vanilla LevelLoadingScreen.update still keeps the active presentation. Vanilla 26.3 BuiltInRegistries.bootStrap populates before freezing and DebugRenderer.refreshRendererList rebuilds the renderer list; Sunrise keeps the same registration moments, dispatch order and validates entries before they are published. Sunrise discards a failed listener's pending registrations so neither partial work nor a panicking entry destructor can stop later listeners. Rejected and retired owned registrations are disposed of under their owner; a destructor panic is logged and queued for an error toast without disabling the registration listener."
migrate = """
ItemStorage::visit_entries(host, visitor) returns Result<std::ops::ControlFlow<()>, StorageError> instead of Result<(), StorageError>. Match Ok(ControlFlow::Break(())) for a visitor-requested stop, Ok(ControlFlow::Continue(())) for exhaustion, and Err(error) for a failed read. To handle only read errors, use `let _ = storage.visit_entries(host, visitor)?;`. In a provider, return Ok(flow) immediately when visitor(kind, amount) returns Break, and Ok(ControlFlow::Continue(())) on exhaustion. The visitor's signature is unchanged.

In each listed registration hook replace `event.<field>.push(value)` with `event.register(value)`, passing the same value. If you used `extend`, iterate over your values and call `event.register` in that order. The private staging list is no longer readable, removable or replaceable. The callback's parameters are unchanged. If your listener panics, its entries are discarded and that listener will not be called again until the next session. The log and error toast name the mod. A phase refusal also discards its batch, but is reported on every invocation without disabling the listener.

- `register_block_state_models`: `definitions`, a namespaced type ID as `String` (version 2). A later successful registration replaces the binding. In `instantiate_block_state_definition` (version 2), continue to match `event.definition_type` and append your picks to `event.models`, but first register every type you answer at startup: the hook is called only for the currently bound mod, named by `event.mod_id`.
- `register_debug_entries`: `entries`, a `DebugEntry` (version 3).
- `register_debug_renderers`: `renderers`, a `DebugRenderer` (version 3).
- `register_dimension_transition_screen`: use `let accepted = event.register(screen)` instead of `event.screens.push(screen)` (version 3). `accepted` is `false` for invalid IDs or an occupied key (including an earlier call in this listener), and `true` for a staged factory. Dimension keys are resolved when successful registrations are published, not by `event.register`. A failed listener discards its whole batch without reserving any keys.
- `register_item_models`: `models`, a node type ID as `String` (version 2).
- `register_item_tint_sources`: `sources`, a tint source ID as `String` (version 2).
- `register_json_animation_types`: `types`, a `JsonAnimationType::Target(id)` or `JsonAnimationType::Interpolation(id)` (version 2).
- `register_model_loaders`: `loaders`, a loader ID as `String` (version 2).
- `register_preset_editors`: `editors`, a `PresetEditor` (version 2). The last valid editor from a successful listener wins. Submit your replacement for the same preset key with `event.register(PresetEditor { preset, screen })`; the override names your mod in the log.
- `register_range_select_item_model_property` and `register_select_item_model_property`: `properties`, a property ID as `String` (both version 2).
- `register_sprite_sources`: `sources`, a sprite source ID as `String` (version 3).

- `register_commands` (version 3): replace `event.commands.push(Command::new(usage))` or `event.commands.push(Command::op(usage, level))` with `event.register(Command::new(usage))` or `event.register(Command::op(usage, level))`. Retain the `&mut dyn ServerHost` parameter and declare the complete current set on each world open, reload and requested refresh.
- `register_client_commands` (version 2): replace `event.commands.push(Command::new(usage))` with `event.register(Command::new(usage))`. Retain the `&mut dyn ClientHost` parameter and declare the complete set on connection and when the server supplies a new tree. A nonzero operator level is still refused on the client.

Keep specialized scoped helpers as they are: `extend_poi_types` lends resolved block metadata to build predicates, `register_cauldron_fluid_content` registers typed block and fluid keys and level information, and `register_enchantment_damage_effects`, `register_load_conditions` and `register_villager_professions` retain their typed registrars and admission rules. These already offer scoped operations rather than reply lists. `block_entity_type_add_blocks` keeps `modify` and `modify_matching` for additions to existing types. `bake_model_loader`, `instantiate_block_state_definition` and `sprite_source` keep their per-resource output contracts: they answer a particular bake, definition or atlas source, not a registration.
"""
