why = "Moves the five EntityPart methods from pasted generator text into scoped catalog hooks: vanilla Mob.registerGoals, LivingEntity.makeBrain and NaturalSpawner.spawnCategoryForPosition at Mob.getMaxSpawnClusterSize (NeoForge EventHooks.getMaxSpawnClusterSize), and NeoForge IShearable.isShearable and IShearable.onSheared. Dispatch uses the kind known to the engine rather than a phase-gated Host read and does not lend an unrelated spawn. Following vanilla ShearsDispenseItemBehavior.tryShearEntity and NeoForge ShearsItem.interactLivingEntity and ShearsDispenseItemBehavior.tryShearEntity, both shearing moments lend the actual tool lazily, and each valid drop survives a neighboring invalid drop. Each moved hook contains callback panics, reports the mod in the log and error toast, and disables only that mod's corresponding hook for the session. Phase refusals are reported on each invocation rather than disabling the hook. EntityPart::entity_subscribed no longer carries an empty default, and sunrise_part no longer needs a second list of methods."
migrate = "Annotate every EntityPart impl with #[mod_api::sunrise_part]; do not provide entity_subscribed yourself. Replace register_goals(registrar) with register_goals(&self, event: &mut RegisterGoalsEvent<'_, '_>) using event.goals, and register_behaviors(registrar) with register_behaviors(&self, event: &mut RegisterBehaviorsEvent<'_, '_>) using event.behaviors. Replace spawn_cluster_size(host, mob, reason, spawner, vanilla) with spawn_cluster_size(&self, host: &dyn Host, event: &mut SpawnClusterSizeEvent) -> Option<u32> and read event.mob, event.reason, event.spawner and event.vanilla. Replace is_shearable(host, entity, player, shears) with is_shearable(&self, host: &dyn Host, event: &mut IsShearableEvent<'_>) -> Option<bool>; read event.entity, event.player and event.shears. Replace on_sheared(host, entity, player, shears) -> Vec<ItemStack> with on_sheared(&self, host: &mut dyn ServerHost, event: &mut OnShearedEvent<'_>); read those same event fields and push drops into event.drops. Use event.shears.damage() for damage or event.shears.project() when you need an owned stack; the view is of the actual dispensed tool too. Invalid drops are reported and skipped individually; the event still takes plain ItemStack values. Fix and restart after a callback panic to re-enable that mod's hook; a phase refusal does not require a restart. Rebuild native mods against the updated SDK."
