ids = ["method:EntityPart::register_goals", "method:EntityPart::register_behaviors", "method:EntityPart::spawn_cluster_size", "method:EntityPart::is_shearable", "method:EntityPart::on_sheared", "hook:register_goals", "hook:register_behaviors", "hook:spawn_cluster_size", "hook:is_shearable", "hook:on_sheared"]
why = "Entity Parts now subscribe to each declared callback they implement. Goals and behaviors still register at vanilla Mob.registerGoals and Brain.Provider.makeBrain. Spawn cluster size follows NaturalSpawner.spawnCategoryForPosition and NeoForge SpawnClusterSizeEvent, not the earlier MobSpawnEvent.SpawnPlacementCheck. Shearing follows NeoForge IShearable and vanilla Shearable: ask readiness with the actual player or dispenser tool, then invoke the same Part that accepted it. The shears are lent without copying their components. An unwinding callback is disabled for its mod and moment, not for other Parts' moments."
migrate = "Annotate each `impl EntityPart` with `#[mod_api::sunrise_part]`; attach it as before through `r.entity_part(...)`. Keep the signatures of `register_goals`, `register_behaviors`, and `spawn_cluster_size`. In `is_shearable` and `on_sheared`, change the shears argument from `&ItemStack` to `ItemStackView<'_>`. Keep scalar reads; replace reads of components or `shears.clone()` with `shears.project()` and handle `None`. `on_sheared` is still called only on the Part whose `is_shearable` returned `Some(true)`, and still returns `Vec<ItemStack>`."
