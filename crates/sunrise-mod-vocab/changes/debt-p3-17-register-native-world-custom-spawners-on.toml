why = "Server levels now own concrete `CustomSpawner` objects directly (matching vanilla `net.minecraft.world.level.CustomSpawner`, `ServerChunkCache#tickChunks`, `ServerLevel#tickCustomSpawners`, `ServerLevel#isSpawningMonsters`, `MinecraftServer#createLevels`, and NeoForge `ModifyCustomSpawnersEvent`) instead of opaque `SpawnerKey` tokens broadcast to every mod via `custom_spawner_tick`. Non-Overworld levels start with an empty custom spawner list as in vanilla, the custom-spawner pass runs in one ordered walk (including `Phantom` before appended mod spawners) only outside debug worlds while `spawn_mobs` is enabled, `spawn_enemies` follows `ServerLevel#isSpawningMonsters()` (`spawn_mobs` and `spawn_monsters`, independent of Peaceful difficulty), each registered spawner is ticked directly under its registering mod inside a server transaction and dropped when the level unloads or the world closes, ordinary Host errors do not disable the spawner, and a panic rolls back that tick, disables that spawner type for the registering mod for the session, and reports through the shared panic queue."
migrate = """
In `Hooks::modify_custom_spawners` (now version 2), remove `SpawnerKey`, `SpawnerEntry`, \
`SpawnerError` and `Hooks::custom_spawner_tick`. Pass a `SpawnerKind` directly to \
`event.spawners.remove(SpawnerKind::...)` and `event.spawners.contains(SpawnerKind::...)`, and \
inspect remaining built-ins with `event.spawners.builtins()`. To add a custom spawner, implement \
`CustomSpawner` (or pass a `FnMut(&mut dyn ServerHost, LevelRef, bool) + Send + 'static` closure) \
and register an owned instance per level with `event.spawners.add(my_spawner)`. Move any \
per-level spawner state onto that struct; the level owns it until unload or world close.
"""
