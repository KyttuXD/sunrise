why = "Match vanilla 26.3 ServerLevel.explode, ServerExplosion, WindCharge.explode, BreezeWindCharge.explode, and ExplosionDamageCalculator.getBlockExplosionResistance, and NeoForge ExplosionEvent.Detonate and IBlockExtension.getExplosionResistance: LevelRef::explosion_destroy_blocks now applies listener-added, removed, and reordered block positions from explosion_detonate with listener-returned order and multiplicity intact (filtered only to loaded in-height chunks); wind bursts (including player and breeze wind charges, even when mob_griefing disables breeze block triggers) now post explosion_detonate before knockback and apply edited block and entity lists to both phases; synthetic caps and admission gates are removed (ResistanceCells::MAX, ResistanceCellsError::TooMany replaced by Overflow for allocation overflow, ExplosionDestroyError::MAX_POSITIONS and TooMany, the 30,000,000 centre bound and loaded-centre-chunk refusal on LevelRef::explode, and the negative-radius refusal on LevelRef::explosion_destroy_blocks); and BlockPart::explosion_resistance (bumped to hook version 2) accepts finite negative values, combining them with fluid resistance via max (0.0 empty, 100.0 water/lava) and refusing only non-finite answers."
migrate = "Remove references to ResistanceCells::MAX, ExplosionDestroyError::MAX_POSITIONS, ResistanceCellsError::TooMany, and ExplosionDestroyError::TooMany. Handle ResistanceCellsError::Overflow for cell areas that exceed allocation capacity. Expect explosion_detonate listeners to hear wind bursts as well as ordinary blasts, to add, remove, or reorder blocks (with listener multiplicity preserved) in LevelRef::explosion_destroy_blocks, LevelRef::explode to run for any finite centre without requiring the centre chunk to be loaded, and BlockPart::explosion_resistance (version 2) finite negative answers to combine with fluid resistance via max. Rebuild native mods against the updated SDK."
