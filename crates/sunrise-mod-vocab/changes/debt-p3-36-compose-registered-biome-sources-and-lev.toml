why = "Vanilla LevelStem.CODEC and NeoForge's LevelStem.CODEC patch keep a dimension type and its complete generator together. Vanilla ChunkGenerator.doCreateBiomes delegates to the configured BiomeSource; ChunkMap uses NoiseRouterData.none() for a non-noise generator. Startup and runtime stems can now use compatible non-fixed biome sources with a registered generator. CommonPlayerSpawnInfo uses DimensionType.STREAM_CODEC, so a runtime instance needs an already registered dimension type. Vanilla has no runtime open or close API: Sunrise keeps its queued lifecycle, but drops the unimplemented generator option, caller namespace gate and artificial level count."
migrate = """
- Replace `RuntimeLevel::new(type_id, RuntimeGenerator::Flat, seed)` with `RuntimeLevel::flat(type_id, seed)`, and `RuntimeLevel::new(type_id, RuntimeGenerator::Void, seed)` with `RuntimeLevel::void(type_id, seed)`.
- Replace `RuntimeLevel::new(type_id, RuntimeGenerator::Mod(generator_id), seed)` with `RuntimeLevel::from_stem(stem_id, seed)`. Declare that stem with `register_dimension` or a dimension data pack. Put the generator id, biome source and any noise settings in that declaration; pass its level id, not its generator id, to `from_stem`. For noise, use `from_stem` with a registered noise stem instead of `RuntimeGenerator::Noise`.
- Replace direct `.dimension_type`, `.generator` and `.seed` reads with a match on the request (`RuntimeLevel::Flat { dimension_type, seed }`, `RuntimeLevel::Void { dimension_type, seed }`, `RuntimeLevel::Stem { stem, seed }`, and a catch-all arm). The `Stem` variant has the stem id, not separate type and generator identifiers. `RuntimeLevel` and `RuntimeLevelError` are in-process values and no longer implement `Wire`.
- Remove `OutsideNamespace`, `CapReached` and `NoiseUnsupported` from `RuntimeLevelError` matches and remove `sunrise-max-runtime-levels` from server properties. Handle `UnknownStem` if the source stem is absent, `UnknownGenerator` if the stem's generator is unsupported, and `UnknownDimensionType` if the type name does not resolve. `open`, `unload` and `delete` keep taking the instance id, in any namespace; reserved ids, unsafe paths and the existing lifecycle checks still refuse. Observe `is_open` after the queue runs; a stem that cannot be built is logged and its instance is not published.
- Keep using `DimensionSettings::biome_source` or `mod_biome_source` at startup. Custom generators no longer require `Fixed`. A custom stem in a data pack or save must include a valid `generator.biome_source`; write `{ "type": "minecraft:fixed", "biome": "minecraft:plains" }` explicitly if that is the intended source. A terrain-only generator does not need noise settings.
