ids = ["type:RuntimeGenerator", "type:RuntimeLevel", "type:RuntimeLevelError", "type:RuntimeLevelError.OutsideNamespace", "type:RuntimeLevelError.NoiseUnsupported", "type:RuntimeLevelError.CapReached", "type:RuntimeLevelError.UnknownStem", "handle:RuntimeLevel::new", "handle:RuntimeLevel::flat", "handle:RuntimeLevel::void", "handle:RuntimeLevel::from_stem", "method:RuntimeLevels::open", "method:RuntimeLevels::unload", "method:RuntimeLevels::delete", "type:DimensionSettings", "handle:DimensionSettings::invalid_biome_source"]
why = "Runtime instances now reuse a registered stem's dimension type, generator, settings and biome source without substituting the generator or inventing options. This follows vanilla LevelStem.CODEC, ChunkGenerator.CODEC, BiomeSource.CODEC and ChunkMap's non-noise RandomState, and NeoForge's LevelStem.CODEC composition. Runtime lifecycle remains Sunrise-only; the namespace gate and artificial level count are gone. Registered chunk generators can use non-fixed biome sources."
migrate = "Replace RuntimeLevel::new(type, RuntimeGenerator::Flat, seed) with RuntimeLevel::flat(type, seed) and RuntimeGenerator::Void with RuntimeLevel::void(type, seed). Replace RuntimeLevel::new(type, RuntimeGenerator::Mod(generator), seed) with RuntimeLevel::from_stem(stem_id, seed): declare that stem at startup via register_dimension (put generator, biome source and noise settings on that DimensionSettings) or provide the matching dimension entry in a data pack. If you attempted RuntimeGenerator::Noise, use from_stem with a registered noise stem. Replace field access with matching RuntimeLevel::{Flat,Void,Stem}; Stem has stem and seed, not separate type and generator fields. RuntimeLevel and RuntimeLevelError no longer implement Wire. Stop matching OutsideNamespace, CapReached and NoiseUnsupported; handle UnknownStem when the named stem is absent and UnknownGenerator when its generator is unsupported. open, unload and delete still take the instance id, which need not be in the calling mod's namespace; reserved ids and lifecycle refusals remain. Remove sunrise-max-runtime-levels from server properties. For a custom generator, choose the normal DimensionSettings biome_source and its settings, or mod_biome_source; no fixed-biome restriction remains."
