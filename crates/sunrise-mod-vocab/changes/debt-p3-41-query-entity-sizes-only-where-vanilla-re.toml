ids = ["hook:entity_size", "method:PlayerRef::simulate_move"]
why = "Version 3 follows NeoForge EntityEvent.Size at construction and Entity.refreshDimensions and removes the synthetic 32-block cap. LocalPlayer.aiStep and Player.updatePlayerPose resolve only the poses they reach, including on PlayerRef::simulate_move's speculative body. Player.canPlayerFitWithinBlocksAndEntitiesWhen checks both blocks and solid entities, using BlockCollisions and Cursor3D's signed arithmetic without a synthetic visit limit. WalkNodeEvaluator.getPathTypeWithinMobBB and WitherBoss.customServerAiStep consume the dimensions without treating absent space as occupied."
migrate = """
Keep the entity_size signature. Decide from event.pose, not the live entity's pose, and propose finite non-negative width, height and eye height. Inactive poses are no longer queried in advance. Proposals have no upper cap; an invalid proposal is reported and leaves the last accepted size in place. A panic disables only your size listener for the session, and the remaining listeners can still answer.

Keep calling PlayerRef::simulate_move with the same arguments. It calls entity_size synchronously and uses the answers on the prediction only. Do not use a size query as notification that the entity committed a pose or size.

For a native mixin targeting MotionWorld::controlled_simulation_tick_with_sprint_window, keep its target and replace a binding of self: &mut MotionWorld with tick: &mut dyn LocalPlayerTick (value = "tick"). Use tick.with_motion for phases using MotionWorld, then call tick.update_local_crouching() or tick.update_player_pose() after the borrow ends. Update any call selectors and, for OVERWRITE, repin the function body.
"""
