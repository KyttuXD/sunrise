ids = ["hook:entity_size", "method:PlayerRef::simulate_move"]
why = "Version 3 removes the synthetic 32-block upper dimension cap, following vanilla EntityDimensions and NeoForge EntityEvent.Size at Entity.refreshDimensions. LocalPlayer.aiStep and Player.updatePlayerPose query dimensions only for poses they test, including on the speculative body used by PlayerRef::simulate_move; Player.canPlayerFitWithinBlocksAndEntitiesWhen uses both block and entity collisions. WalkNodeEvaluator.getPathTypeWithinMobBB classifies the oversized footprint without walking absent cells, and WitherBoss.customServerAiStep follows the signed arithmetic of BlockPos.betweenClosed."
migrate = "Keep the entity_size signature and answer each query from event.pose using finite non-negative dimensions; do not rely on inactive poses being queried each tick or on a 32-block cap. Keep calling PlayerRef::simulate_move with the same arguments, but expect it to run entity_size synchronously and use its answers on the prediction only. Listeners must not treat a query (even for the live pose) as notification that the player committed that pose or size."
