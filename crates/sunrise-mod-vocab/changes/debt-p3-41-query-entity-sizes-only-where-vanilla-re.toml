ids = ["hook:entity_size"]
why = "Version 3 removes the synthetic 32-block upper dimension cap (accepting any finite non-negative size and logging a warning on non-finite or negative answers, matching vanilla EntityDimensions and NeoForge EntityEvent.Size) and stops eagerly precomputing inactive player candidate poses before motion. Player pose-fit queries now resolve only the candidate poses vanilla actually tests in LocalPlayer.aiStep and Player.updatePlayerPose/canPlayerFitWithinBlocksAndEntitiesWhen (including FallFlying, Sleeping, SpinAttack and replayed ticks) on demand with live minecraft:scale."
migrate = "Do not rely on entity_size firing for inactive poses each tick or on answers above 32 blocks being rejected; answer from event.pose using finite non-negative dimensions."
