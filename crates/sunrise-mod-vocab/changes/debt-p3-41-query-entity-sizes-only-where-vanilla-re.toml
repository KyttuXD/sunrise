ids = ["hook:entity_size", "fn:sunrise_client::motion::MotionWorld::controlled_simulation_tick_with_sprint_window", "fn:sunrise_client::motion::MotionWorld::apply_local_input"]
why = "NeoForge EntityEvent.Size and EventHooks.getEntitySizeForge resolve the current box at Entity.refreshDimensions. The earlier eager player-pose batch supplied mods' dimensions to collision checks before the body was borrowed (20447a98ad8). Vanilla Player.updatePlayerPose, Player.canPlayerFitWithinBlocksAndEntitiesWhen, and LocalPlayer.aiStep instead query as their checks are reached. Query the live scale and use the chosen candidate's result. An invalid proposal is reported and discarded without affecting other listeners; a panic disables only the failing callback."
migrate = "Keep Hooks::entity_size(&self, host, event) and edit *event.size as before. Switch any prefill, call-count or tick-order logic to a per-query answer for event.pose and the proposed dimensions, including gliding, sleeping and spin-attack candidates. To replace local input/travel in a native mixin, retarget MotionWorld::controlled_simulation_tick_with_sprint_window(keys, sprint_window) -> Result<()> to MotionWorld::apply_local_input(keys, sprint_window, replay_sprinting) -> Result<Vec3>. Return the position before travel; the engine performs crouch detection before this method and pose selection, movement statistics and food handling after it. replay_sprinting is Some only for a replay."
