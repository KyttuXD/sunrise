ids = [
    "method:prelude::EntitiesServerHost::spawn_falling_block",
    "handle:LevelRef::spawn_falling_block",
    "hook:entity_join_level",
]
why = """
Vanilla 26.3 `FallingBlockEntity.fall` replaces the source with its legacy fluid
state and adds the entity through `ServerLevel.addFreshEntity`.
`PersistentEntitySectionManager.addEntity` files it in a section even if that
section is not accessible or ticking. This path does not require a loaded chunk
or use `SummonCommand.createEntity`'s `Level.isInSpawnableBounds` check.
NeoForge asks `EntityJoinLevelEvent` during admission, not after later scheduled
block ticks. Its `CommonHooks.onPlayerTossEvent` asks about the item before adding
that item; it does not delay another entity's admission.

The old server helper took a dimension string, accepted only the level in place,
imposed a 1,024-entity quota and clamped live velocity. Both natural and typed
spawns now use one fresh falling-block path and ask the same join hook. The typed
call works for any open server level and leaves the source untouched.
`Entity.setDeltaMovement` keeps the live velocity; `ClientboundAddEntityPacket`
and `ClientboundSetEntityMotionPacket` quantize it only at encoding (`LpVec3`).
Air is admitted and discarded on its first tick (`FallingBlockEntity.tick`).
"""
migrate = """
Replace `host.spawn_falling_block(dimension, state, pos, velocity, falling)` with:

```rust,ignore
let Some(level) = host.level(dimension) else { return; };
match level.spawn_falling_block(host, state, pos, velocity, falling) {
    Ok(Some(entity)) => { /* handle to the new falling block */ }
    Ok(None) => { /* non-finite position or velocity, exhausted ids, or a join veto */ }
    Err(err) => { /* Stale (stale or closed level), Unavailable (client), or InvalidState */ }
}
```

- Pass the intended open level even when parked. Neither summon bounds nor
  whether the destination chunk is loaded governs admission; spawning does not
  load a chunk. Remove any handling for a parked-level or unloaded-chunk refusal.
- No per-level count cap or live velocity clamp applies. Air now spawns and is
  discarded when first ticked; skip the call yourself if you do not want it made.
- After `entity_constructing`, the spawn asks `entity_join_level`. A veto returns
  `Ok(None)` before the call returns, including from an `item_toss` listener.
  With a transaction in the destination level the join waits for its root commit;
  treat the returned handle as provisional until that commit, since an abort or
  a join veto makes it stale. A transaction only in the caller's level does not
  defer work in a different destination level.
- Keep the same `entity_join_level` callback. A fresh natural fall is now told
  before the next scheduled block tick, not after the scheduled pass. A veto
  keeps the falling entity out; it does not restore the replaced source block.
"""
