ids = ["method:prelude::EntitiesServerHost::spawn_falling_block", "handle:LevelRef::spawn_falling_block"]
why = "Use the same fresh falling-block construction as vanilla 26.3 FallingBlockEntity.fall, and the ordinary ServerLevel.addFreshEntity admission represented by NeoForge EntityJoinLevelEvent. Level.isInSpawnableBounds defines the placement bounds. Entity.setDeltaMovement keeps finite motion unchanged; ClientboundAddEntityPacket quantizes only the tracked copy. The per-level falling-block quota and pre-spawn velocity clamp are gone."
migrate = "Replace host.spawn_falling_block(dimension, state, pos, velocity, falling) with level.spawn_falling_block(host, state, pos, velocity, falling), where level is the LevelRef already in scope or obtained with host.level(dimension). Match Ok(Some(entity)) for success, Ok(None) for a refused or vetoed spawn, and Err(error) for an invalid registry state or unavailable or stale level. A join veto at transaction commit leaves the returned handle stale. State, position, velocity and Falling arguments stay the same, and the source block is still not edited."
