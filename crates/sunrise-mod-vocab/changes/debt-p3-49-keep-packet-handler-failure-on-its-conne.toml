ids = ["behaviour:payload_handler_connection_isolation"]
why = "NeoForge NetworkRegistry.handleModdedPayload and ClientNetworkRegistry.handleModdedPayload invoke IPayloadHandler.handle with the receiving listener's IPayloadContext and do not poison the registration; IPayloadContext.enqueueWork likewise belongs to that delivery. Vanilla Connection.exceptionCaught and PacketProcessor.ListenerAndPacket.handle route packet faults to the receiving connection or listener. Sunrise removes the old registration-wide panic state while preserving its declared-payload disconnect, raw delivery isolation, transaction rollback and ingress lease cleanup. Call-owned work and its destructor are contained and attributed to the mod; panics name that mod in the log and client error toast."
migrate = "No author code changes: keep IPayloadHandler::handle, PayloadWork::run and context.enqueue_work(work). Return PayloadHandleError::Failed for invalid input as before. A panic does not unregister the handler: only the receiving connection closes for a declared payload, and a failed raw delivery does not stop later packets. Cancelled work is released without calling run."
