ids = ["trait:IPayloadHandler", "method:IPayloadHandler::handle", "trait:PayloadWork", "method:PayloadWork::run", "method:IPayloadContext::enqueue_work"]
why = "NeoForge NetworkRegistry.handleModdedPayload and ClientNetworkRegistry.handleModdedPayload invoke IPayloadHandler.handle with the receiving listener's IPayloadContext; IPayloadContext.disconnect and enqueueWork belong to that delivery. Vanilla Connection.exceptionCaught handles packet failure on the receiving connection. Sunrise no longer carries a registration-wide panic latch over from the guest-era callback policy. Failed declared deliveries close only that connection; failed raw deliveries discard only that mod's staged work. Panics still name the mod in the log and error toast. Cancelled owned work is disposed of without invoking it."
migrate = "No signatures or call sites change: keep IPayloadHandler::handle, PayloadWork::run and context.enqueue_work(work). Return PayloadHandleError::Failed for invalid input as before. Do not rely on a panic to stop later handler calls or re-register to recover: the same callback remains available to other connections, and a raw callback remains available on the current connection too. A failed delivery still does not publish its staged replies or work."
