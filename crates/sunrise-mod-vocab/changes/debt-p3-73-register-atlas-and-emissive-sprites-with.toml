why = "Register atlases by their definition ID, with exactly the built-ins from vanilla 26.3 AtlasManager.KNOWN_ATLASES and first-registration-wins for duplicate keys from NeoForge ClientHooks.gatherTextureAtlases and RegisterTextureAtlasesEvent.register. Like vanilla AtlasManager's SpriteId, each atlas/sprite pair keeps its distinct identity. TextureManager.register replaces the same output key; SpriteResourceLoader and FallbackResourceManager.createStackMetadataFinder keep metadata with the winning texture. TextureAtlas and SpriteLoader.stitch use the device's real RGBA texture side; Sunrise logs and isolates failed batches before publishing the GUI atlas. Emissive sprite keys resolve at bake and reload; only final usable overlays take texture layers and a row in the shader's Globals.emissive_layers table."
migrate = """
In Hooks::emissive, change the signature from
`fn emissive(&self, host: &dyn ClientHost, event: &mut EmissiveEvent<'_>)`
to
`fn emissive(&self, context: &RegistrationContext, event: &mut EmissiveEvent<'_>)`
and replace `event.layers.push((base, overlay))` with
`event.register(EmissiveSpriteRegistration::new(base, overlay))` using typed `Identifier`s.
`emissive` now runs at client startup and on every resource reload instead of per frame, and accepts
overlay textures at any `assets/<namespace>/textures/<path>.png` without the `emissive/` prefix or
32-entry cap.

In Hooks::register_texture_atlases, `event.register(atlas)` remains the registration call.
Change `TextureAtlasRegistration { atlas, definition }` to `TextureAtlasRegistration { atlas }`.
If the old values differed, move the definition JSON from the old `definition` path to the
`atlas` path, or keep the JSON where it is and pass its `definition` ID as `atlas`. Do not use a
built-in definition ID as a separate mod atlas. Distinct valid atlas definitions need distinct IDs.
The unchanged `event.register` call now accepts non-built-in `minecraft:` and `sunrise:` IDs and
reports duplicates by definition ID, keeping the first. A replacement raw texture's sidecar is not
inherited by the registered sprite. A batch that exceeds the device's stitch limits is refused
without shrinking unrelated sprites.

Keep `registration.sprite_name(&sprite_id)` and use its returned value for `host.gui_sprite`
and `DrawContext::sprite`. Replace hardcoded names such as `mymod:gui/atlases/icons/mymod/heart`
with `registration.sprite_name(&Identifier::parse("mymod:heart")?)` for `mymod:icons`; the returned
key is now `mymod:gui/atlases/xicons/xmymod/xheart`. Old projected names are not aliases.

For a native replacement of `sunrise_client_render::sprites::Sprites::register`, accept the
`PreparedSprite` parameter instead of `sprite_cache::Decoded`; it carries the decoded sprite and
its already validated animation. Rebuild native mods against the updated SDK.
"""
