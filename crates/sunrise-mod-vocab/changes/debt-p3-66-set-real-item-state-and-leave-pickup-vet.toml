why = "Vanilla 26.3 ItemEntity.setPickUpDelay takes signed int ticks, narrowing to a short only in addAdditionalSaveData. Resident setters, LevelRef spawning and prepared drops now use those same values. ItemEntity.setItem accepts an empty stack; ItemEntity.tick later discards it, while a consumer such as HopperBlockEntity.addItem discards after taking the last item. ServerEntity.sendChanges and ClientPacketListener.handleTakeItemEntity keep a tracked client's stack up to date. NeoForge ItemEntityPickupEvent.Pre at ItemEntity.playerTouch vetoes only the current touch and otherwise tries the captured stack against the item's live delay and target. Post reports the captured pickup even when a setter replaced the resident stack."
migrate = '''
- `item.set_stack(host, stack)` on `ItemEntityRef` and `view.set_stack(stack)` on `ItemEntitySubjectView`: pass `Some(stack)` instead of `stack`, or `None` (or an air stack) to clear it and let `ItemEntity.tick` discard it. Use `EntityRef::discard` or `EntityRef::remove` for immediate removal.
- `ItemEntitySubjectView::pickup_delay()` now returns `i32` instead of `Option<i32>`: use the returned delay directly without unwrapping or matching `Some`.
- The `pickup_delay` argument to `LevelRef::spawn_item`, `LevelRef::spawn_item_with_motion` and `ItemDrop::new`, the `ItemDrop.pickup_delay` field, both `PreparedDropView::pickup_delay` and `PreparedDropMut::pickup_delay` return values, and `PreparedDropMut::set_pickup_delay` all change from `u32` to `i32`. Use signed ticks in each call, field and binding; replace `u32::MAX` with `32767` for never picking up (or call `item.set_never_pickup(host)` on a resident item). Other values are stored unchanged until the save's short encoding. Rebuild any Wire payload using `ItemDrop` with the signed field.
- `Hooks::item_picked_up` (version 2 -> 3): `TriState::False` no longer applies a ten-tick delay. Call `event.item.set_pickup_delay(host, ticks)` or `set_default_pickup_delay(host)` if you want an explicit cooldown. The item is now accessible on both paths, and its delay and target edits take effect for this attempt. If a listener calls `event.item.set_stack`, Inventory.add still attempts the stack captured before Pre.
- `Hooks::item_picked_up_post` (version 3 -> 4): `original` and the initial `remaining` describe the captured attempt even if Pre replaced the stack. Read `event.item.with_stack(host, |stack| stack.project())` to get the current resident stack instead. Editing `remaining` still changes the ground unless a Post listener explicitly wrote it through `event.item.set_stack`. An independent replacement does not change how many items were taken from the captured stack; as in NeoForge, exhausting that captured stack discards the entity.
'''
