version = 1
doc = "ClientHost::hold_packets gives the calling mod an independent hold for the current physical play incarnation. ClientHost::release_held publishes only the newly unblocked prefix in send order; ClientHost::drop_held discards the packets its hold covered, including overlaps, without ending another hold. ClientHost::send_packet retains its writer credit from acceptance through root commit and any holds, never auto-flushing due to pressure. Protocol replies use the same writer without competing with unpublished held packets. A disconnect, protocol change or the server's refusal of an already predicted passage crossing invalidates the IDs. A local send veto does not end a hold. The writer revokes old-play reservations before its transition acknowledgement."
